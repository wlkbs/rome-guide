const $ = id => document.getElementById(id);
const au = $('au');
const ls = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let tour = ls.get('tour','v');
let cur = ls.get('cur_'+tour, null);
let chapFilter = null;
let done = new Set(ls.get('done',[]));
const speeds=[1,1.1,1.25,1.5]; let sp = ls.get('speed',1);
$('auto').checked = ls.get('auto', false);

const fmt = s => { if(!isFinite(s)||s<0) s=0; s=Math.round(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const T = () => DATA[tour].tracks;
const chOf = t => t.id.split('-')[0];
const toast = (m) => { const e=$('toast'); e.textContent=m; e.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>e.hidden=true, 2600); };

/* ---------- map ---------- */
let proj, vb={x:0,y:0,w:400,h:300}, vbAnim;
function setupProj(){
  const [lat0,lng0]=DATA[tour].center; const k=Math.cos(lat0*Math.PI/180)*111320;
  proj = ([lat,lng]) => [ (lng-lng0)*k, (lat0-lat)*110540 ];
}
const NS='http://www.w3.org/2000/svg';
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function drawMap(){
  setupProj();
  const svg=$('svg'); svg.innerHTML='';
  const S=SHAPES[tour];
  const g=el('g',{},svg);
  const fillFor=c=>c==='b'?'var(--bldg)':c==='dome'?'var(--bldg)':c==='arena'?'var(--land)':'var(--road)';
  el('rect',{x:-3000,y:-3000,width:6000,height:6000,fill:'var(--land)'},g);
  S.lines.forEach(l=>{ el('polyline',{points:l.pts.map(p=>proj(p).join(',')).join(' '),fill:'none',stroke:l.cls==='road'?'var(--road)':'var(--muted)','stroke-width':l.cls==='road'?18:3,'stroke-dasharray':l.cls==='walk'?'7 6':'none','stroke-linecap':'round','stroke-linejoin':'round'},g); });
  S.ellipses.forEach(e=>{ const [x,y]=proj(e.c); el('ellipse',{cx:x,cy:y,rx:e.rx,ry:e.ry,fill:fillFor(e.cls),stroke:'var(--line)','stroke-width':2,transform:e.rot?`rotate(${e.rot} ${x} ${y})`:''},g); });
  S.polys.forEach(p=>{ el('polygon',{points:p.pts.map(q=>proj(q).join(',')).join(' '),fill:fillFor(p.cls),stroke:'var(--line)','stroke-width':1.5},g); });
  S.circles.forEach(c=>{ const [x,y]=proj(c.c); el('circle',{cx:x,cy:y,r:c.r,fill:'var(--bldg)',stroke:'var(--muted)','stroke-width':2},g); });
  const lg=el('g',{id:'labels'},svg);
  S.labels.forEach(l=>{ const [x,y]=proj(l.p); const t=el('text',{x:x+(l.dx||0),y:y+(l.dy||0),class:'lbl'},lg); t.textContent=l.t; });
  el('g',{id:'route'},svg); el('g',{id:'pins'},svg);
  drawPins();
}
function chapterTracks(ch){ return T().filter(t=>chOf(t)===ch); }
function drawPins(){
  const pg=$('pins'), rg=$('route'); pg.innerHTML=''; rg.innerHTML='';
  const ch = chapFilter || (cur ? chOf(T()[cur]) : '2');
  const list = chapterTracks(ch).filter(t=>t.pos);
  const s = vb.w/400;
  // route through this chapter's stops
  if(list.length>1) el('polyline',{points:list.map(t=>proj(t.pos).join(',')).join(' '),fill:'none',stroke:'var(--accent)','stroke-width':2.2*s,'stroke-dasharray':`${5*s} ${4*s}`,opacity:.8},rg);
  list.forEach(t=>{
    const i=T().indexOf(t); const [x,y]=proj(t.pos);
    const g=el('g',{class:'pin',transform:`translate(${x} ${y}) scale(${s})`,role:'button','aria-label':t.id+' '+t.title,tabindex:0},pg);
    const isCur=i===cur;
    el('circle',{r:isCur?13:10,fill:isCur?'var(--accent)':(done.has(tour+t.id)?'var(--done)':'var(--ink)'),'stroke-width':2},g);
    const tx=el('text',{},g); tx.textContent=t.id.split('-')[1]; tx.style.fill=isCur?'var(--accent-ink)':'var(--bg)';
    g.addEventListener('click',()=>select(i,true));
    g.addEventListener('keydown',e=>{if(e.key==='Enter')select(i,true)});
  });
  // labels scale
  $('labels').querySelectorAll('text').forEach(t=>t.style.fontSize=(11*s)+'px');
  const note=$('note');
  if(ch==='1'){ note.hidden=false; note.textContent='1장은 장소와 상관없이 가기 전에 숙소에서 미리 들어 두세요.'; }
  else note.hidden=true;
  fitTo(list.length?list:T().filter(t=>t.pos), ch==='1');
  const ct = cur!=null && T()[cur].pos ? T()[cur] : list[0];
  const gm=$('gmap');
  if(ct && ct.pos){ gm.href=`https://www.google.com/maps/search/?api=1&query=${ct.pos[0]},${ct.pos[1]}`; gm.hidden=false; } else gm.hidden=true;
}
function fitTo(list, wide){
  const pts=list.map(t=>proj(t.pos));
  let xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  let w=Math.max(x1-x0,wide?400:150), h=Math.max(y1-y0,wide?300:110);
  const cx=(x0+x1)/2, cy=(y0+y1)/2; w*=1.45; h*=1.45;
  if(w/h>4/3) h=w*3/4; else w=h*4/3;
  animateVB({x:cx-w/2,y:cy-h/2,w,h});
}
function animateVB(to){
  cancelAnimationFrame(vbAnim); const from={...vb}; const t0=performance.now();
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const step=now=>{ const k=reduce?1:Math.min(1,(now-t0)/450), e=1-Math.pow(1-k,3);
    for(const key in vb) vb[key]=from[key]+(to[key]-from[key])*e;
    $('svg').setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    if(k<1) vbAnim=requestAnimationFrame(step); else rescalePins(); };
  vbAnim=requestAnimationFrame(step);
}
function rescalePins(){
  const s=vb.w/400;
  $('pins').querySelectorAll('g.pin').forEach(g=>g.setAttribute('transform',g.getAttribute('transform').replace(/scale\([^)]*\)/,`scale(${s})`)));
  const r=$('route').firstChild; if(r){r.setAttribute('stroke-width',2.2*s); r.setAttribute('stroke-dasharray',`${5*s} ${4*s}`);}
  $('labels').querySelectorAll('text').forEach(t=>t.style.fontSize=(11*s)+'px');
}

/* ---------- chips & list ---------- */
function chapters(){ const m=new Map(); T().forEach(t=>{const c=chOf(t); if(!m.has(c)) m.set(c,t.ch);}); return m; }
function drawChips(){
  const box=$('chips'); box.innerHTML='';
  const active = chapFilter || (cur!=null?chOf(T()[cur]):'2');
  chapters().forEach((name,c)=>{
    const b=document.createElement('button'); b.textContent=c+'장 '+name.replace(/^\d+\.\s*/,'').replace(/\s*\(.*\)/,'');
    b.setAttribute('aria-pressed', String(c===active));
    b.onclick=()=>{ chapFilter=c; drawChips(); drawPins(); };
    box.appendChild(b);
  });
}
function drawList(){
  const main=$('list'); main.innerHTML='';
  chapters().forEach((name,c)=>{
    const sec=document.createElement('section'); sec.className='chapter'; sec.id='ch'+c;
    const tr=chapterTracks(c); const tot=tr.reduce((a,t)=>a+(t.dur||0),0);
    const h=document.createElement('h2'); h.textContent=name; if(tot){const s=document.createElement('span'); s.textContent=Math.round(tot/60)+'분'; h.appendChild(s);} sec.appendChild(h);
    tr.forEach(t=>{
      const i=T().indexOf(t);
      const d=document.createElement('div'); d.className='track'+(i===cur?' cur':'')+(done.has(tour+t.id)?' done':''); d.id='t'+i;
      const b=document.createElement('button'); b.className='row';
      b.innerHTML=`<span class="num">${t.id}</span><span class="tt"></span><span class="meta"></span>`;
      b.querySelector('.tt').textContent=t.title;
      b.querySelector('.meta').textContent=(done.has(tour+t.id)?'✓ ':'')+(t.dur?fmt(t.dur):'');
      b.onclick=()=>select(i,true);
      d.appendChild(b);
      if(i===cur){
        const s=document.createElement('div'); s.className='script';
        const tb=document.createElement('button'); tb.textContent='대본 보기'; s.appendChild(tb);
        const body=document.createElement('div'); body.hidden=true; body.style.cssText='display:flex;flex-direction:column;gap:8px';
        t.text.forEach(p=>{const q=document.createElement('p'); q.textContent=p; body.appendChild(q);});
        tb.onclick=()=>{ body.hidden=!body.hidden; tb.textContent=body.hidden?'대본 보기':'대본 접기'; };
        s.appendChild(body); d.appendChild(s);
      }
      sec.appendChild(d);
    });
    main.appendChild(sec);
  });
}

/* ---------- player ---------- */
function select(i, play){
  cur=i; chapFilter=null; const t=T()[i];
  ls.set('cur_'+tour,i);
  $('pid').textContent=t.id; $('ptitle').textContent=t.title;
  au.src=t.src; au.playbackRate=sp;
  const saved=ls.get('pos_'+tour+t.id,0);
  au.onloadedmetadata=()=>{ if(saved>3 && saved<au.duration-5) au.currentTime=saved; $('tdur').textContent=fmt(au.duration); };
  if(play){ au.play().catch(()=>{}); }
  if('mediaSession' in navigator){ try{ navigator.mediaSession.metadata=new MediaMetadata({title:t.id+' '+t.title, artist:'코미꼬', album:DATA[tour].full}); }catch(e){} }
  drawChips(); drawList(); drawPins();
  document.getElementById('t'+i)?.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function setPlayIcon(){ $('iplay').innerHTML = au.paused?'<path d="M8 5v14l11-7z"/>':'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>'; $('bplay').setAttribute('aria-label',au.paused?'재생':'일시정지'); }
$('bplay').onclick=()=>{ if(cur==null){ select(0,true); return;} if(!au.src) select(cur,false); au.paused?au.play().catch(()=>toast('이 트랙이 아직 저장되지 않았어요. 위의 저장하기를 눌러 주세요.')):au.pause(); };
$('bback').onclick=()=>au.currentTime=Math.max(0,au.currentTime-10);
$('bfwd').onclick=()=>au.currentTime=Math.min(au.duration||0,au.currentTime+10);
$('bprev').onclick=()=>{ if(au.currentTime>5){au.currentTime=0;return;} if(cur>0) select(cur-1,true); };
$('bnext').onclick=()=>{ if(cur<T().length-1) select(cur+1,true); };
$('bspeed').onclick=()=>{ sp=speeds[(speeds.indexOf(sp)+1)%speeds.length]; au.playbackRate=sp; ls.set('speed',sp); $('bspeed').textContent=spl(sp); };
const spl=v=>(v===1?'1.0':String(v))+'×'; $('bspeed').textContent=spl(sp);
$('auto').onchange=e=>ls.set('auto',e.target.checked);
au.addEventListener('play',setPlayIcon); au.addEventListener('pause',setPlayIcon);
au.addEventListener('error',()=>{ if(au.src) toast('이 트랙 음성을 아직 불러올 수 없어요.'); });
let lastSave=0;
au.addEventListener('timeupdate',()=>{
  if(!seeking){ $('seek').value=au.duration?au.currentTime/au.duration*1000:0; }
  $('tcur').textContent=fmt(au.currentTime);
  const now=Date.now(); if(now-lastSave>3000 && cur!=null){ lastSave=now; ls.set('pos_'+tour+T()[cur].id, au.currentTime); }
});
au.addEventListener('ended',()=>{
  const t=T()[cur]; done.add(tour+t.id); ls.set('done',[...done]); ls.set('pos_'+tour+t.id,0);
  if($('auto').checked && cur<T().length-1) select(cur+1,true); else { drawList(); drawPins(); }
});
let seeking=false;
$('seek').addEventListener('input',e=>{ seeking=true; if(au.duration) $('tcur').textContent=fmt(e.target.value/1000*au.duration); });
$('seek').addEventListener('change',e=>{ if(au.duration) au.currentTime=e.target.value/1000*au.duration; seeking=false; });
if('mediaSession' in navigator){
  try{
    navigator.mediaSession.setActionHandler('previoustrack',()=>$('bprev').click());
    navigator.mediaSession.setActionHandler('nexttrack',()=>$('bnext').click());
    navigator.mediaSession.setActionHandler('seekbackward',()=>$('bback').click());
    navigator.mediaSession.setActionHandler('seekforward',()=>$('bfwd').click());
  }catch(e){}
}

/* ---------- tour switch ---------- */
function setTour(k){
  au.pause(); tour=k; ls.set('tour',k); cur=ls.get('cur_'+k,null); chapFilter=null;
  $('tv').setAttribute('aria-pressed',String(k==='v')); $('tc').setAttribute('aria-pressed',String(k==='c'));
  $('h').textContent=DATA[k].full;
  vb={x:0,y:0,w:400,h:300};
  drawMap(); drawChips(); drawList();
  if(cur!=null){ const t=T()[cur]; $('pid').textContent=t.id; $('ptitle').textContent=t.title; au.removeAttribute('src'); }
  else { $('pid').textContent=''; $('ptitle').textContent='듣고 싶은 트랙을 눌러 주세요'; au.removeAttribute('src'); }
  $('tcur').textContent='0:00'; $('tdur').textContent=cur!=null&&T()[cur].dur?fmt(T()[cur].dur):'0:00'; $('seek').value=0; setPlayIcon();
}
$('tv').onclick=()=>setTour('v'); $('tc').onclick=()=>setTour('c');
setTour(tour);

const FILES=["audio/c/1-1.mp3", "audio/c/1-2.mp3", "audio/c/1-3.mp3", "audio/c/1-4.mp3", "audio/c/1-5.mp3", "audio/c/1-6.mp3", "audio/c/1-7.mp3", "audio/c/2-1.mp3", "audio/c/2-2.mp3", "audio/c/2-3.mp3", "audio/c/2-4.mp3", "audio/c/2-5.mp3", "audio/c/2-6.mp3", "audio/c/2-7.mp3", "audio/c/3-1.mp3", "audio/c/3-2.mp3", "audio/c/3-3.mp3", "audio/c/3-4.mp3", "audio/c/3-5.mp3", "audio/c/3-6.mp3", "audio/c/3-7.mp3", "audio/c/3-8.mp3", "audio/c/4-1.mp3", "audio/c/4-2.mp3", "audio/c/4-3.mp3", "audio/c/4-4.mp3", "audio/c/4-5.mp3", "audio/c/5-1.mp3", "audio/c/5-2.mp3", "audio/c/5-3.mp3", "audio/v/1-1.mp3", "audio/v/1-2.mp3", "audio/v/1-3.mp3", "audio/v/1-4.mp3", "audio/v/1-5.mp3", "audio/v/1-6.mp3", "audio/v/2-1.mp3", "audio/v/2-2.mp3", "audio/v/2-3.mp3", "audio/v/2-4.mp3", "audio/v/2-5.mp3", "audio/v/3-1.mp3", "audio/v/3-10.mp3", "audio/v/3-11.mp3", "audio/v/3-12.mp3", "audio/v/3-13.mp3", "audio/v/3-2.mp3", "audio/v/3-3.mp3", "audio/v/3-4.mp3", "audio/v/3-5.mp3", "audio/v/3-6.mp3", "audio/v/3-7.mp3", "audio/v/3-8.mp3", "audio/v/3-9.mp3", "audio/v/4-1.mp3", "audio/v/4-2.mp3", "audio/v/4-3.mp3", "audio/v/4-4.mp3", "audio/v/4-5.mp3", "audio/v/4-6.mp3", "audio/v/4-7.mp3", "audio/v/5-1.mp3", "audio/v/5-2.mp3", "audio/v/5-3.mp3", "audio/v/5-4.mp3", "audio/v/5-5.mp3", "audio/v/5-6.mp3", "audio/v/6-1.mp3", "audio/v/6-2.mp3", "audio/v/6-3.mp3", "audio/v/6-4.mp3", "audio/v/6-5.mp3", "audio/v/6-6.mp3", "audio/v/7-1.mp3", "audio/v/7-2.mp3", "audio/v/7-3.mp3", "audio/v/7-4.mp3", "audio/v/7-5.mp3", "audio/v/7-6.mp3", "audio/v/8-1.mp3", "audio/v/8-2.mp3", "audio/v/8-3.mp3", "audio/v/8-4.mp3", "audio/v/8-5.mp3", "audio/v/8-6.mp3", "audio/v/8-7.mp3"]; const AUD='audio-v1';
async function cachedCount(){ try{ const c=await caches.open(AUD); const ks=await c.keys(); const set=new Set(ks.map(r=>new URL(r.url).pathname.split('/audio/')[1])); return FILES.filter(f=>set.has(f.slice(6))).length; }catch(e){ return -1; } }
async function offState(){ const n=await cachedCount(); const box=$('off'); if(n<0){box.hidden=true;return;}
  if(n>=FILES.length){ box.hidden=false; $('offt').textContent='인터넷 없이 쓸 준비 끝'; $('offd').textContent='86트랙이 이 휴대폰에 저장돼 있어요. 비행기 모드에서도 들을 수 있어요.'; $('offb').hidden=true; $('offp').style.width='100%'; setTimeout(()=>box.hidden=true,4000); }
  else { box.hidden=false; $('offp').style.width=(n/FILES.length*100)+'%'; if(n>0) $('offt').textContent=`저장 중단됨 (${n}/${FILES.length})`; } }
$('offb').onclick=async()=>{ const b=$('offb'); b.disabled=true; try{ await navigator.storage?.persist?.(); }catch(e){}
  const c=await caches.open(AUD); let n=0, fail=0;
  for(const f of FILES){ try{ if(!(await c.match(f))){ const r=await fetch(f); if(!r.ok) throw 0; await c.put(f,r); } n++; }catch(e){ fail++; }
    $('offp').style.width=(n/FILES.length*100)+'%'; $('offt').textContent=`저장 중 ${n}/${FILES.length}`; }
  b.disabled=false; if(fail){ $('offt').textContent=`${fail}개를 못 받았어요. 와이파이에서 다시 눌러 주세요.`; b.textContent='다시 저장'; } else offState(); };
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
