<style>
/* Layout: phone-first pocket guide — tour switch, mini map that zooms per chapter, chapter track list, fixed bottom player */
:root{
  --bg:#ECEEEE; --surface:#FFFFFF; --ink:#17202A; --muted:#5B6570; --line:#D3D8DC;
  --accent:#D9A410; --accent-ink:#1B1606; --land:#E2E6E3; --bldg:#C3CACF; --road:#F7F8F8; --done:#2F7D5B;
  --f-display:"Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1318; --surface:#181E26; --ink:#ECEEF0; --muted:#9AA4AF; --line:#29313B;
  --accent:#E8B923; --accent-ink:#1B1606; --land:#141920; --bldg:#2D3642; --road:#1E252E; --done:#5BC495; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1318; --surface:#181E26; --ink:#ECEEF0; --muted:#9AA4AF; --line:#29313B;
  --accent:#E8B923; --accent-ink:#1B1606; --land:#141920; --bldg:#2D3642; --road:#1E252E; --done:#5BC495; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 210px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:10px;padding-top:14px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:1.45rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand small{color:var(--muted);font-size:.78rem;letter-spacing:.06em}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 .95rem var(--f-body);padding:9px 0;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mapcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.map{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--land)}
.map svg{display:block;width:100%;height:100%;touch-action:manipulation}
.map .note{position:absolute;inset:auto 10px 10px 10px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.82rem;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px;scrollbar-width:none;border-top:1px solid var(--line)}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 .82rem var(--f-body);padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.maplink{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 12px 10px;font-size:.8rem;color:var(--muted)}
.maplink a{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.chapter{display:flex;flex-direction:column;gap:6px}
.chapter h2{font-family:var(--f-display);font-size:1.08rem;margin:10px 2px 2px;text-wrap:balance}
.chapter h2 span{color:var(--muted);font-family:var(--f-body);font-size:.78rem;font-weight:500;margin-left:6px}
.track{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column}
.track button.row{all:unset;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:11px 12px}
.track button.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:12px}
.num{font-variant-numeric:tabular-nums;font-weight:600;font-size:.8rem;color:var(--muted);text-align:center;border:1px solid var(--line);border-radius:8px;padding:3px 0}
.tt{min-width:0;font-weight:500;line-height:1.35}
.meta{font-variant-numeric:tabular-nums;font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.done .num{border-color:var(--done);color:var(--done)}
.track.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.track.cur .num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.script{padding:0 14px 12px 66px;display:flex;flex-direction:column;gap:8px}
.script button{align-self:flex-start;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 .8rem var(--f-body);padding:5px 10px;border-radius:999px;cursor:pointer}
.script p{margin:0;color:var(--ink);font-size:.93rem;max-width:65ch}
.player{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.08);z-index:5}
.player .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.now{display:flex;gap:10px;align-items:baseline;min-width:0}
.now b{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem;flex:none}
.now span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-variant-numeric:tabular-nums;font-size:.75rem;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.ctl{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;justify-items:center}
.ctl button{border:0;background:transparent;color:var(--ink);width:48px;height:44px;border-radius:12px;cursor:pointer;display:grid;place-items:center;font:600 .8rem var(--f-body)}
.ctl button:focus-visible{outline:2px solid var(--accent)}
.ctl button.play{width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink)}
.ctl svg{width:24px;height:24px;fill:currentColor}
.opts{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted)}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.toast{position:fixed;left:50%;bottom:200px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.85rem;max-width:calc(100% - 32px);z-index:6}
.pin{cursor:pointer}
.pin circle{stroke:var(--surface)}
.pin text{font:600 10px var(--f-body);fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.lbl{font-family:var(--f-body);fill:var(--muted);text-anchor:middle;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.offcard{background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.offcard>div:first-child{flex:1 1 220px;min-width:0}.offcard b{font-size:.95rem}.offcard p{margin:2px 0 0;color:var(--muted);font-size:.82rem}
.offcard button{border:0;background:var(--accent);color:var(--accent-ink);font:600 .9rem var(--f-body);padding:9px 16px;border-radius:999px;cursor:pointer}
.offcard button[disabled]{opacity:.6}.bar2{flex-basis:100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar2 i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
header{padding-top:max(14px,env(safe-area-inset-top))}
</style>

<div class="wrap">
  <header>
    <div class="brand"><h1 id="h">코미꼬의 바티칸 투어</h1><small>ROMA · AUDIO</small></div>
    <div class="seg" role="group" aria-label="투어 선택">

  <section class="mapcard" aria-label="미니 지도">

  </section>
  <main id="list"></main>
</div>

<div class="player" aria-label="플레이어">
  <div class="in">
    <div class="now"><b id="pid">1-1</b><span id="ptitle">트랙을 골라 주세요</span></div>
    <div class="bar"><span id="tcur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="재생 위치"><span id="tdur">0:00</span></div>

  </div>
</div>

<script>
const DATA = {"v": {"name": "바티칸", "full": "코미꼬의 바티칸 투어", "tracks": [{"id": "1-1", "ch": "1. 미리 듣기", "title": "세상에서 가장 작은 나라, 가장 거대한 이야기", "text": ["여러분은 지금 세계에서 가장 작은 나라로 떠날 준비를 하고 계십니다. 면적은 축구장 육십 개 남짓, 인구는 구백 명도 안 되는 나라. 그런데 이 작은 나라가 지금도 전 세계 십사 억 가톨릭 신자의 중심이고, 인류가 만든 가장 위대한 예술품들을 품고 있죠. 바로 바티칸입니다.", "질문 하나 드릴게요. 왜 바티칸에 가시나요? 유럽 오면 다들 한 번쯤 가니까? 교황님이 계신 곳이라서? 아니면 미켈란젤로의 천장화를 직접 보고 싶어서?", "어떤 이유든 좋습니다. 다만 아무 정보 없이 가시면 아마 이런 말만 하다 오실 거예요. \"사람 진짜 많네…\", \"건물 진짜 크네…\", \"그림 참 예쁘네…\".", "하지만 걱정 마세요. 제가 있잖아요? 저는 바티칸을 여러 번 직접 걸으며 동선을 확인했고, 이탈리아어·영어 공식 자료까지 뒤져서 이 가이드를 만들었습니다.", "이 투어를 다 들으시면 알게 되실 겁니다. 왜 이 작은 나라가 로마 한복판에 따로 있는지, 왜 순례자들은 이곳을 평생 한 번은 와야 할 곳이라고 하는지, 그리고 \"나는 화가가 아니다\"라고 외치던 한 조각가가 어떻게 인류 최고의 그림을 남겼는지까지요.", "그리고 하나 더. 이번 투어에는 숨은 주인공이 있습니다. 바로 '열쇠'입니다. 바티칸 곳곳에서 열쇠가 몇 번이나 나오는지 한번 세어 보세요. 마지막에 이 열쇠가 아주 재밌게 쓰이는 장면이 기다리고 있거든요.", "듣는 만큼 보입니다. 코미꼬의 바티칸 투어, 지금 바로 출발합니다! 안디아모! \"갑시다!\""], "pos": null, "src": "audio/v/1-1.mp3", "dur": 94.6}, {"id": "1-2", "ch": "1. 미리 듣기", "title": "단 세 문장으로 배우는 바티칸", "text": ["바티칸이 왜 이탈리아 수도 로마 한가운데에 따로 떨어진 나라로 있는지, 딱 세 문장으로 정리해 볼게요.", "첫 번째 문장. 원래 교황은 이탈리아 중부를 다스리던 왕이었다.", "십구세기 중반까지 교황은 종교 지도자이자, 로마를 포함한 이탈리아 중부의 넓은 땅을 다스리는 군주였습니다. 군대도 있고 세금도 걷었죠.", "두 번째 문장. 그런데 천팔백칠십년, 이탈리아가 통일되면서 그 땅을 전부 빼앗겼다.", "막 하나로 뭉친 이탈리아 왕국은 로마를 수도로 삼고 싶었습니다. 그래서 교황의 땅을 무력으로 흡수해 버렸죠. 화가 난 교황은 이탈리아 정부를 인정하지 않겠다며 바티칸 담장 안에 스스로를 가둡니다. 그리고 자신을 '바티칸의 포로'라고 불렀죠. 이 대치가 무려 오십구년이나 이어졌습니다. 상상해 보세요. \"다시는 밖에 안 나가!\" 하고 방문 잠근 사춘기 아들이 오십구년을 버틴 겁니다.", "세 번째 문장. 천구백이십구년, 서로 한 발씩 물러나 세상에서 가장 작은 나라가 태어났다.", "천구백이십구년, 교황 비오 십일 세 측과 당시 이탈리아 총리였던 무솔리니가 '라테란 조약'을 맺습니다. 교황청은 옛 땅을 포기하고, 이탈리아는 교황이 누구의 간섭도 받지 않는 작은 독립국을 인정한 거죠. 그렇게 해서 지금 우리가 갈 바티칸 시국이 탄생했습니다.", "어때요? 참 쉽죠? 세상에서 가장 작은 나라는, 사실 가장 큰 땅을 잃고 얻은 나라인 셈입니다."], "pos": null, "src": "audio/v/1-2.mp3", "dur": 93.3}, {"id": "1-3", "ch": "1. 미리 듣기", "title": "\"나는 화가가 아니다\", 미켈란젤로", "text": ["바티칸에서 가장 많이 듣게 될 이름은 단연 미켈란젤로입니다. 피에타, 쿠폴라, 시스티나 성당 천장화, 최후의 심판까지 전부 그의 작품이죠. 그런데 미켈란젤로는 스스로를 화가라고 생각하지 않았습니다. 그는 조각가였습니다.", "당시 이탈리아 예술계에는 뜨거운 논쟁이 있었습니다. \"그림과 조각, 어느 쪽이 더 위대한가?\" 레오나르도 다 빈치는 그림 편이었습니다. 반면 미켈란젤로는 확고한 조각 편이었죠. 그는 이런 시를 남겼습니다. \"가장 뛰어난 예술가도, 대리석 한 덩어리가 이미 품고 있지 않은 것은 떠올릴 수 없다.\" 조각가는 돌 속에 이미 있는 형상을 깎아서 꺼내 주는 사람이라는 거죠. 그래서 그는 편지에 서명할 때도 자주 '조각가 미켈란젤로'라고 썼습니다.", "그런데 교황 율리오 이 세가 이 조각가에게 시스티나 성당 천장 전체를 그리라고 명령합니다. 미켈란젤로는 아버지에게 보낸 편지에 \"그림은 내 직업이 아닌데\"라고 투덜댔고, 친구에게 보낸 시에는 \"나는 화가도 아니다\"라고 적었죠. 그의 전기를 쓴 제자는 이게 라이벌들이 그를 망신 주려고 꾸민 일이었다고 전합니다.", "하지만 상대는 '무서운 교황'이라고 불리던 율리오 이 세. 군대를 이끌고 직접 전쟁터에 나가던 교황이었습니다. 천장화 작업 중에 \"도대체 언제 끝나냐?\"는 교황의 물음에 미켈란젤로가 \"될 때요!\"라고 대꾸했다가 지팡이로 얻어맞았다는 이야기까지 전해지죠.", "결국 그는 붓을 듭니다. 그리고 천장에 대리석을 깎아 놓은 듯한 근육질 인물들을 그려 넣었습니다. \"나는 화가가 아니다\"라던 조각가가 회화의 역사를 통째로 바꿔 버린 셈이죠. 오늘 투어의 마지막, 시스티나 성당에서 그 결과를 직접 확인해 보세요."], "pos": null, "src": "audio/v/1-3.mp3", "dur": 110.3}, {"id": "1-4", "ch": "1. 미리 듣기", "title": "소요 시간과 추천 동선", "text": ["바티칸을 어떤 순서로 보면 좋을지 알려드릴게요. 첨부한 지도를 봐주세요.", "바티칸은 크게 두 구역으로 나뉩니다. 지도 아래쪽의 '성 베드로 광장과 대성당', 그리고 위쪽의 '바티칸 박물관'입니다. 대성당은 무료이고, 박물관은 유료죠. 우리가 바티칸 하면 떠올리는 라파엘로의 '아테네 학당', 미켈란젤로의 시스티나 성당은 모두 박물관 쪽에 있습니다.", "중요한 건 두 곳의 입구가 따로 있다는 점입니다. 대성당에서 박물관 입구까지는 성벽을 따라 걸어서 십오 분 정도 걸립니다.", "제가 추천하는 동선은 '오전에 대성당, 오후에 박물관'입니다.", "먼저 아침 일찍 성 베드로 광장에서 대성당 보안 검색 줄을 섭니다. 줄 서 있는 동안 이 장 '성 베드로 광장'을 들으시면 지루하지 않으실 거예요. 대성당 내부는 사십 분에서 한 시간 정도면 충분합니다. 체력이 된다면 쿠폴라, 즉 돔 꼭대기 전망대도 올라가 보세요. 사십 분 정도 더 걸립니다.", "그다음 근처에서 점심을 드시고, 오후 한 시에서 두 시쯤 박물관에 입장하세요. 박물관은 오전에 단체 관광객이 몰리기 때문에 오후가 그나마 덜 붐빕니다. 박물관에서 시스티나 성당까지 보는 데는 세 시간에서 네 시간 정도 걸립니다.", "한 가지 더. 이 가이드를 한 번에 다 들으실 필요는 없습니다. 구매 후 삼십 일 동안 들으실 수 있으니, 바티칸 가기 전날 숙소에서 일 장을 미리 들어 두시면 현장에서 훨씬 편하실 거예요. 물론 이 동선이 아니어도 괜찮습니다. 내 마음대로 돌아다녀도 되는 것, 그게 셀프 투어의 매력 아니겠습니까?"], "pos": null, "src": "audio/v/1-4.mp3", "dur": 96.4}, {"id": "1-5", "ch": "1. 미리 듣기", "title": "티켓 사는 법", "text": ["바티칸은 무료 구역과 유료 구역이 나뉘어 있습니다.", "먼저 성 베드로 대성당은 무료입니다. 다만 공항처럼 보안 검색을 받아야 해서 줄이 깁니다. 그래서 아침 일찍 가시길 추천드리죠.", "쿠폴라 전망대는 대성당 쪽 현장 매표소에서 따로 표를 삽니다. 전부 걸어 올라가는 오백오십일 계단 코스와, 엘리베이터를 타고 올라간 뒤 삼백이십 계단만 걷는 코스가 있습니다. 이천이십육년 십 월 기준 현장 가격은 계단 십 유로, 엘리베이터 십오 유로이고, 현장에서는 현금만 받습니다.", "바티칸 박물관과 시스티나 성당은 예약이 사실상 필수입니다. 현장 줄은 몇 시간씩 늘어서거든요. 공식 사이트에서 방문일 육십 일 전부터 예약할 수 있고, 여름 오전 시간대는 몇 주 전에 매진되기도 합니다.", "첨부한 영상을 따라 하시면 쉽습니다.", "준비물은 해외 결제가 되는 카드, 여권 정보, 이메일 주소입니다. 공식 사이트 뮤제이바티카니 점 브이에이에 들어가 언어를 영어로 바꾸고, '티켓' 메뉴에서 '어드미션 티켓'를 고릅니다. 날짜와 시간, 인원을 고르고, 성인은 '풀 프라이스', 만 십팔 세 이하나 학생증이 있는 학생은 '리듀스드'를 선택하세요. 할인 티켓은 입구에서 증명서를 확인하니 여권과 학생증을 꼭 챙기셔야 합니다. 이천이십육년 십 월 기준 온라인 가격은 일반 이십오 유로, 할인 십오 유로입니다. 예약비 오 유로가 포함된 가격이죠.", "결제를 마치면 큐알 코드가 있는 바우처가 이메일로 옵니다. 환불은 안 되니 날짜를 꼭 두 번 확인하세요. 당일에는 예약 시간 십오 분 전쯤 도착해서, 현장 구매 줄이 아니라 예약자 줄로 가시면 됩니다."], "pos": null, "src": "audio/v/1-5.mp3", "dur": 102.5}, {"id": "1-6", "ch": "1. 미리 듣기", "title": "가기 전에 알아 둘 꿀팁", "text": ["본격적으로 출발하기 전에, 꼭 알아 두실 것들을 정리해 드릴게요.", "첫째, 요일입니다. 바티칸 박물관은 일요일에 문을 닫습니다. 단, 매달 마지막 일요일은 오전에 무료로 열리는데, 그날은 사람이 어마어마하게 몰립니다. 그리고 수요일 오전에는 교황님이 성 베드로 광장에서 신자들을 만나는 '일반 알현'이 있어서 대성당이 낮 열두 시 삼십 분 전후까지 닫힙니다. 수요일이라면 일정을 바꾸시거나, 아예 알현 행사를 구경해 보시는 것도 특별한 경험이 될 거예요.", "둘째, 복장입니다. 바티칸은 지금도 기도하는 곳입니다. 어깨와 무릎이 드러나는 옷은 입장을 거절당할 수 있어요. 여름이라면 가벼운 스카프 하나 챙기시면 좋습니다.", "셋째, 짐입니다. 입구에서 보안 검색을 하는데, 칼처럼 뾰족한 물건, 큰 가방, 삼각대, 장우산은 반입이 제한됩니다. 최대한 가볍게 오세요.", "넷째, 소매치기입니다. 광장과 대성당은 무료다 보니 로마에서도 소매치기가 많은 곳입니다. 특히 피에타 앞처럼 사람이 몰리는 곳에서는 휴대폰과 지갑을 몸 앞쪽에 두세요. 감동은 잔뜩 챙겨 가시되, 지갑은 아무도 못 챙겨 가게 하세요.", "다섯째, 시스티나 성당에서는 사진 촬영이 금지되고, 조용히 해야 합니다. 이어폰으로 제 설명 듣는 건 괜찮으니 걱정 마세요.", "여섯째, 식사입니다. 박물관 안 식당은 가격 대비 만족도가 높지 않은 편입니다. 박물관에 들어가기 전에 바깥에서 든든히 드시고, 물과 간식을 챙겨 가세요.", "참고로 이천이십육년 십 월 기준 박물관은 월요일부터 토요일까지 아침 여덟 시에 열어 저녁 여덟 시에 닫고, 마지막 입장은 오후 여섯 시입니다. 대성당은 아침 일곱 시부터 엽니다.", "자, 준비 끝입니다."], "pos": null, "src": "audio/v/1-6.mp3", "dur": 111.4}, {"id": "2-1", "ch": "2. 성 베드로 광장 (줄 서면서 들어도 좋아요)", "title": "두 팔 벌려 안아 주는 광장", "text": ["성 베드로 광장에 잘 도착하셨나요? 보안 검색 줄에 서 계신다면, 오히려 잘됐습니다. 지금부터 줄 서는 시간을 투어 시간으로 바꿔 드릴게요.", "대성당을 정면으로 바라보세요. 양옆으로 거대한 기둥들이 반원을 그리며 광장을 감싸고 있죠? 이 광장을 설계한 사람은 십칠세기 로마의 천재 건축가 잔 로렌초 베르니니입니다. 그는 이 기둥 회랑을 두고 이렇게 설명했습니다. 교회가 어머니처럼 두 팔을 벌려 찾아오는 모든 사람을 안아 주는 모습이라고요. 대성당이 머리, 양쪽 회랑이 두 팔인 셈이죠.", "기둥은 모두 이백팔십사 개, 그 위에 서 있는 성인 조각상은 백사십 명입니다. 성인들이 지붕 위에서 우리를 내려다보며 \"어서 와, 줄 길지?\" 하고 위로해 주는 것 같지 않나요?", "이 광장에는 숨은 놀이가 하나 있습니다. 광장 가운데 높이 솟은 돌기둥과 양쪽 분수 사이 바닥을 보시면, 둥근 돌판이 하나씩 박혀 있습니다. 첨부한 사진을 봐주세요. '첸트로 델 콜로나토', 회랑의 중심이라고 적혀 있죠. 그 돌판 위에 서서 회랑을 바라보세요. 네 줄로 서 있던 기둥들이 감쪽같이 한 줄로 겹쳐 보일 겁니다. 줄에서 빠지기 어려우시면, 나오는 길에 꼭 해 보세요.", "그리고 이 광장은 실용적이기도 합니다. 부활절이나 성탄절에 교황님이 대성당 발코니에서 축복을 내릴 때, 최대한 많은 사람이 그 모습을 볼 수 있도록 만든 무대이기도 하거든요.", "자, 이제 광장 한가운데 붉은 돌기둥을 볼까요?"], "pos": [41.90215, 12.4576], "src": "audio/v/2-1.mp3", "dur": 96.6}, {"id": "2-2", "ch": "2. 성 베드로 광장 (줄 서면서 들어도 좋아요)", "title": "베드로의 마지막을 지켜본 돌기둥, 오벨리스크", "text": ["광장 한가운데 우뚝 솟은 뾰족한 돌기둥, 오벨리스크입니다. 고대 그리스인들이 '작은 꼬챙이'라는 뜻으로 부른 데서 이름이 나왔죠. 꼬챙이치고는 좀 큽니다. 무게가 약 삼백삼십 톤, 높이는 받침과 십자가까지 합치면 사십 미터가 넘습니다.", "자세히 보시면 이음새가 없습니다. 거대한 돌 하나를 통째로 깎아 만든 거죠. 원래는 이집트에서 만들어졌는데, 이집트 오벨리스크에 흔히 있는 상형문자가 이 기둥에는 하나도 없다는 것도 특이한 점입니다.", "이 이집트 돌기둥이 왜 로마에 와 있을까요? 범인은 로마 황제 칼리굴라입니다. 서기 일세기, 칼리굴라는 이집트에서 이 돌기둥을 배에 실어 와 자기 전차 경기장 한가운데에 세웠습니다. 이집트를 정복한 로마의 힘을 자랑하는 일종의 트로피였죠.", "그런데 그 경기장이 바로 이 근처였습니다. 그리고 전승에 따르면 그곳에서 수많은 기독교인이 처형당했고, 베드로도 그 근처에서 십자가에 거꾸로 매달려 순교했다고 하죠. 그러니까 이 돌기둥은 베드로의 마지막 순간을 지켜봤을지도 모르는 목격자인 셈입니다.", "꼭대기를 보세요. 십자가가 얹혀 있죠? 황제의 승리를 자랑하던 기둥 위에, 그 황제들이 박해했던 기독교의 상징이 올라간 겁니다. 역사의 반전이란 이런 거죠.", "이제 발밑을 보세요. 오벨리스크를 중심으로 바닥에 하얀 선과 둥근 돌판들이 있습니다. 십구세기 초에 추가된 장치인데, 정오에 오벨리스크 그림자가 어느 별자리 돌판에 닿는지로 계절을 알 수 있는 거대한 해시계입니다. 광장 전체가 시계인 셈이죠."], "pos": [41.90222, 12.45727], "src": "audio/v/2-2.mp3", "dur": 98.5}, {"id": "2-3", "ch": "2. 성 베드로 광장 (줄 서면서 들어도 좋아요)", "title": "\"밧줄에 물을 부으시오!\"", "text": ["이 오벨리스크는 원래 지금 자리가 아니라, 대성당 왼쪽 옆에 서 있었습니다. 그걸 광장 한가운데로 옮기라고 명령한 사람이 십육세기 교황 식스토 오 세입니다.", "천오백팔십육년, 삼백삼십 톤짜리 돌기둥을 옮기는 대공사가 시작됩니다. 인부 약 구백 명, 말 백여 마리가 동원됐죠. 교황은 현장의 집중력을 위해 무시무시한 명령을 내렸다고 전해집니다. \"작업 중에 소리를 내는 자는 사형에 처한다!\"", "드디어 기둥을 세우는 날. 수많은 밧줄이 팽팽하게 당겨지는데, 그만 밧줄이 마찰열로 타들어 가기 시작합니다. 이대로라면 밧줄이 끊어지고 기둥이 쓰러질 판. 하지만 다들 사형이 무서워 입을 열지 못했죠.", "바로 그때, 한 선원이 목숨을 걸고 외칩니다.", "\"밧줄에 물을 부으시오!\"", "인부들이 밧줄에 물을 끼얹자 밧줄이 버텼고, 오벨리스크는 무사히 섰습니다. 교황은 명령을 어긴 이 선원을 처벌했을까요? 아닙니다. 오히려 큰 상을 내렸습니다. 해마다 부활절 일주일 전 '성지 주일'에 쓰는 종려나무 가지를 바티칸에 바치는 특권이었죠.", "이 선원의 고향이 산레모냐 보르디게라냐를 두고 두 도시가 지금도 서로 \"우리 동네 사람\"이라고 주장하는데요. 재밌게도 두 도시 모두 지금까지 교황에게 종려나무 가지를 엮어 보내고 있다고 합니다. 소리 한 번 잘 질러서 사백년 넘게 동네 자랑거리가 된 셈이죠."], "pos": [41.90232, 12.45712], "src": "audio/v/2-3.mp3", "dur": 85.6}, {"id": "2-4", "ch": "2. 성 베드로 광장 (줄 서면서 들어도 좋아요)", "title": "광대 옷이 아닙니다, 스위스 근위병", "text": ["대성당 정면 왼쪽을 보시면 커다란 아치형 문이 있습니다. 문 위에 종과 시계가 달려 있어서 '종의 아치'라고 부르죠. 첨부한 사진을 봐주세요. 이 문은 바티칸 시국 안쪽, 그러니까 관광객은 못 들어가는 진짜 나라 안으로 통하는 출입구입니다. 그리고 그 앞을 노랑·파랑·빨강 줄무늬 옷을 입은 사람들이 지키고 있죠. 바로 스위스 근위병입니다. 근위병은 이곳 말고도 오른쪽 회랑 끝, 교황의 거처로 이어지는 '청동문' 앞에서도 볼 수 있습니다.", "바티칸 인구는 구백 명이 안 되는데, 그중 백삼십오 명이 스위스 근위병입니다. 정식 군대가 없는 바티칸에서 교황을 지키는 세계에서 가장 작은 군대죠.", "그런데 왜 하필 스위스 사람일까요? 중세 스위스는 알프스 산악 지대라 먹고살 산업이 부족했습니다. 그래서 가장 큰 수출품이 '사람', 즉 용병이었죠. 스위스 용병은 강했을 뿐 아니라, 한 번 계약하면 돈이나 상황에 흔들리지 않고 끝까지 의리를 지키는 걸로 유명했습니다. 그래서 천오백육년, 교황 율리오 이 세가 스위스 용병을 불러 근위대를 만들었죠.", "그 의리가 증명된 날이 천오백이십칠년 오 월 육 일입니다. 신성 로마 제국 군대가 로마로 쳐들어와 도시를 약탈했죠. 그날 스위스 근위병 백팔십구 명 중 백사십칠 명이 목숨을 잃었습니다. 그들이 시간을 버는 동안, 교황 클레멘스 칠 세는 비밀 통로를 통해 근처 요새로 피신할 수 있었죠. 그래서 지금도 해마다 오 월 육 일에 새 근위병들의 입대 선서식이 열립니다.", "지금도 아무나 될 수 없습니다. 스위스 국적의 가톨릭 신자 남성이어야 하고, 나이는 십구 세에서 삼십 세, 키는 백칠십사 센티미터 이상, 입대할 때 미혼이어야 하죠.", "그리고 다들 궁금해하시는 그 옷. 미켈란젤로가 디자인했다는 소문이 유명한데, 사실이 아닙니다. 천구백십사년, 당시 근위대장이 라파엘로의 그림을 참고해 지금의 제복을 디자인했죠. 그 그림은 이따 박물관 '라파엘로의 방'에서 직접 보실 수 있습니다. 근위병 옷이 그림 속에 숨어 있는지, 그때 한번 찾아보세요."], "pos": [41.9031, 12.4564], "src": "audio/v/2-4.mp3", "dur": 129.7}, {"id": "2-5", "ch": "2. 성 베드로 광장 (줄 서면서 들어도 좋아요)", "title": "노란 우체통에 엽서 한 장, 바티칸 우체국", "text": ["여행지에서 나에게, 혹은 소중한 사람에게 엽서 한 장 보내 보는 건 어떨까요? 그것도 '세상에서 가장 작은 나라'에서요.", "바티칸은 독립국이라 자기 나라 우체국과 우표가 따로 있습니다. 대성당을 바라보고 광장 왼쪽을 보세요. 회랑 안쪽에 나무와 유리로 지은 작은 우체국이 있고, 그 근처 관광 안내소 옆에도 우체국이 하나 더 있습니다. 첨부한 사진을 봐주세요. 월요일부터 토요일까지, 아침 여덟 시 삼십 분부터 저녁 여섯 시 삼십 분까지 문을 엽니다. 박물관 안에도 우체국이 있으니, 지금 시간이 없으시면 이따 들르셔도 됩니다.", "여기서 우표와 엽서를 사서 바로 보낼 수 있는데, 주의하실 점이 하나 있습니다. 바티칸 우표를 붙인 엽서는 반드시 바티칸 우체통에 넣어야 합니다. 광장의 노란 우체통이죠. 로마 시내의 빨간 이탈리아 우체통에 넣으면 안 됩니다. 반대로 이탈리아 우표로는 바티칸 우체통을 쓸 수 없고요. 길 하나 건너면 다른 나라라는 게 이럴 때 실감 나죠.", "바티칸의 우편번호는 영영일이영입니다. 세상에서 가장 작은 나라의 소인이 찍힌 엽서, 집에 도착하면 이번 여행의 가장 작고 확실한 기념품이 될 겁니다. 헤헤."], "pos": [41.9015, 12.4566], "src": "audio/v/2-5.mp3", "dur": 76.3}, {"id": "3-1", "ch": "3. 성 베드로 대성당", "title": "성당 입구, 크기에 속지 마세요", "text": ["보안 검색 통과하시느라 고생 많으셨습니다. 지금 서 계신 곳은 대성당 정문 앞 현관입니다. 문이 다섯 개 있죠? 그중 맨 오른쪽 문을 봐주세요. '성스러운 문'이라는 뜻의 '성문'입니다. 평소에는 안쪽이 벽돌로 막혀 있다가, 보통 이십오년마다 돌아오는 '희년'에만 교황이 직접 엽니다. 이 문을 통과하는 순례자는 큰 은총을 받는다고 믿죠. 가장 최근에는 이천이십오년 희년에 열렸다가 이천이십육년 일 월에 다시 닫혔습니다. 그러니 지금 우리가 보는 건 굳게 닫힌 청동문입니다.", "이 대성당은 베드로의 무덤 위에 세워졌습니다. 사세기에 지은 첫 성당을 허물고 천오백육년에 다시 짓기 시작해, 백이십년 만인 천육백이십육년에 완성됐죠. 그 사이 교황이 스무 명이나 바뀌었고, 미켈란젤로, 라파엘로, 베르니니 같은 천재들이 차례로 손을 댔습니다. 대한민국 국회의사당을 짓는 데 육년 걸렸으니, 이 성당은 국회의사당을 스무 번 지을 시간이 걸린 셈입니다.", "안으로 들어가시면 일단 크기에 놀라실 텐데요. 사실 이 성당은 너무 커서 오히려 작아 보입니다. 입구 쪽 첫 번째 큰 기둥들에 성수 그릇을 들고 있는 아기 천사 조각이 보이실 거예요. 첨부한 사진을 봐주세요. 멀리서는 귀여운 아기 같지만, 가까이 가 보면 이 미터가 넘습니다. 어른보다 큰 아기죠. 모든 게 같은 비율로 커서 우리 눈이 크기를 잘못 읽는 겁니다.", "바닥도 보세요. 가운데 통로를 따라 금색 글씨가 새겨져 있습니다. 세계의 유명한 성당들이 이 성당 안에 들어오면 어디까지 오는지 길이를 표시해 둔 겁니다. 이 성당의 길이는 백팔십육 미터, 런던의 세인트 폴 대성당은 백오십팔 미터 지점에 표시되어 있죠. \"다른 성당들은 여기까지밖에 안 와요~\" 하는 은근한 자랑입니다. 행사가 있는 날엔 카펫에 가려 안 보일 수도 있어요.", "자, 이제 오른쪽으로 가볼까요? 사람이 가장 많이 몰려 있는 곳, 유리벽 뒤의 하얀 조각이 오늘 대성당의 첫 번째 주인공입니다."], "pos": [41.90218, 12.45495], "src": "audio/v/3-1.mp3", "dur": 127.6}, {"id": "3-2", "ch": "3. 성 베드로 대성당", "title": "스물네 살의 피에타", "text": ["지금 보고 계신 조각이 아마 세계에서 가장 유명한 조각상일 겁니다. 미켈란젤로가 스물네 살에 완성한 '피에타'입니다. 피에타는 이탈리아어로 '연민', '깊은 슬픔'이라는 뜻이죠. 십자가에서 내려진 예수의 시신을 어머니 마리아가 무릎에 안고 있는 모습입니다.", "원래 이 조각은 로마에 와 있던 프랑스 추기경이 자기 장례 예배당에 두려고 주문한 작품입니다. 당시 이미 유명한 조각가들도 있었지만, 추기경은 막 실력을 드러내던 스물세 살 청년에게 맡겼죠. 계약서에는 이런 문장이 들어갔다고 합니다. \"로마에서 가장 아름다운 대리석 작품이 될 것.\" 젊은 조각가로서는 엄청난 부담이었겠죠? 미켈란젤로는 직접 대리석 산지인 카라라로 가서 돌을 골랐고, 단 한 덩어리의 대리석에서 이 두 사람을 깎아 냈습니다.", "유심히 보시면 놀라운 비밀이 숨어 있습니다. 다 큰 성인 남자를 여인이 무릎에 가로로 눕혀 안는 건 사실 불가능하죠. 그래서 미켈란젤로는 마리아의 하체를 실제보다 훨씬 크게 만들었습니다. 그리고 그 커다란 하체를 풍성한 옷주름으로 감쪽같이 가렸죠. 그래서 우리는 전혀 어색함을 못 느끼고 안정감만 느낍니다.", "작품이 공개되자 사람들이 수군거렸습니다. \"서른세 살 아들이 죽었는데, 엄마 얼굴이 왜 저렇게 앳된 소녀 같아?\" 미켈란젤로는 이렇게 답했다고 전해집니다. \"순결한 여인은 늙지 않는다.\" 마리아의 젊은 얼굴은 나이가 아니라 영원한 순결함을 표현한 거죠.", "그런데 왜 이렇게 멀리, 유리벽 너머로만 볼 수 있을까요? 천구백칠십이년, 한 남자가 \"내가 예수 그리스도다!\"라고 외치며 망치로 이 조각을 열다섯 번 가까이 내리쳤습니다. 마리아의 왼팔과 코, 눈꺼풀이 부서졌죠. 전문가들이 조각 파편을 하나하나 모아 복원했지만, 그 뒤로는 방탄 유리벽 뒤에서만 볼 수 있게 됐습니다.", "차가운 대리석을 사람의 살결보다 부드럽게 깎아 낸 스물네 살 청년의 솜씨. 잠시 말없이 감상해 보세요."], "pos": [41.90262, 12.45462], "src": "audio/v/3-2.mp3", "dur": 126.4}, {"id": "3-3", "ch": "3. 성 베드로 대성당", "title": "\"이거 내가 만들었다고!\", 피에타의 서명", "text": ["미켈란젤로는 평생 수많은 작품을 남겼지만, 자기 이름을 새긴 작품은 이 피에타 하나뿐입니다. 마리아의 가슴을 가로지르는 띠를 봐주세요. 첨부한 사진을 봐주세요. 라틴어로 이렇게 새겨져 있습니다. \"피렌체 사람 미켈란젤로 부오나로티가 만들었다.\"", "여기에는 귀여운 일화가 전해집니다. 피에타가 공개된 뒤, 미켈란젤로가 사람들 반응이 궁금해 몰래 성당에 갔습니다. 그런데 밀라노 근처에서 온 관광객들이 감탄하며 이러는 겁니다.", "\"이야, 이건 분명 우리 동네 조각가 '곱보'가 만든 거야!\"", "열심히 만든 건 난데, 엉뚱한 사람이 칭찬을 가로채 가다니! 스물네 살 혈기 왕성한 청년은 참지 못했습니다. 그날 밤 등불과 정을 들고 몰래 성당에 들어가, 마리아의 띠에 자기 이름을 큼지막하게 새겨 넣었죠.", "요즘으로 치면 내 영상을 남이 퍼 가서 자기가 만든 척하니까, 화면 한가운데 커다랗게 워터마크를 박아 버린 셈입니다. 저도 이 마음 너무 잘 압니다.", "나중에 거장이 된 미켈란젤로는 이 일을 두고두고 후회했다고 합니다. 그래서 다비드상이나 모세상 같은 대작에는 끝내 이름을 새기지 않았죠. 이름을 새기지 않아도 누구 작품인지 세상이 다 알게 됐으니까요.", "자, 이제 대성당 안쪽으로 걸어 들어가 볼까요? 오른쪽 큰 기둥 앞에 앉아 있는 검은 청동상이 보이실 거예요."], "pos": [41.9027, 12.4545], "src": "audio/v/3-3.mp3", "dur": 86.0}, {"id": "3-4", "ch": "3. 성 베드로 대성당", "title": "발이 닳아 버린 베드로", "text": ["지금 보고 계신 청동상이 이 성당의 주인공, 성 베드로입니다. 십삼세기 말에 만들어진 것으로 보이는 작품이죠.", "발을 봐주세요. 오른발 발가락이 반질반질하게 닳아 있죠? 칠백년 넘게 전 세계 순례자들이 이 발을 만지고 입을 맞추며 기도했기 때문입니다. 청동이 사람 손에 닳아 없어질 정도면, 얼마나 많은 소원이 이 발에 얹혔을지 짐작이 가시나요?", "오른손은 손가락 두 개를 들어 축복을 내리고 있고, 왼손에는 열쇠를 쥐고 있습니다. 자, 오늘의 첫 번째 열쇠입니다. 하나 세어 두세요.", "이 열쇠에는 사연이 있습니다. 베드로는 원래 갈릴리 호수의 평범한 어부였고, 이름은 시몬이었습니다. 예수는 그를 수제자로 삼으며 '베드로', 즉 '바위'라는 새 이름을 지어 주고 이렇게 말했죠. \"너는 베드로다. 내가 이 바위 위에 내 교회를 세우리라. 그리고 너에게 하늘나라의 열쇠를 주겠다.\" 그래서 베드로는 언제나 열쇠를 든 모습으로 그려집니다. 그리고 가톨릭에서는 베드로를 첫 번째 교황으로 보고, 지금의 교황들을 그 열쇠를 물려받은 후계자로 봅니다.", "그런데 \"이 바위 위에 교회를 세우리라\"는 말씀, 비유로 하신 말씀이겠죠? 하지만 이 성당은 그걸 문자 그대로 실현했습니다. 어떻게 했는지는 다음 트랙에서 알려드릴게요. 성당 한가운데, 거대한 청동 기둥 네 개가 받치고 있는 제단 앞으로 가 주세요."], "pos": [41.90246, 12.45378], "src": "audio/v/3-4.mp3", "dur": 89.6}, {"id": "3-5", "ch": "3. 성 베드로 대성당", "title": "바위 위에 세운 교회, 베드로의 무덤", "text": ["지금 서 계신 성당 한가운데. 이곳 바로 아래, 땅속 깊은 곳에 베드로의 무덤이 있습니다.", "베드로는 서기 육십년대, 네로 황제 시절 로마에서 십자가에 매달려 순교했습니다. 이때 \"감히 예수님과 똑같은 모습으로 죽을 수 없다\"며 십자가에 거꾸로 매달리기를 청했다고 전해지죠. 아까 광장의 오벨리스크가 지켜봤을지도 모른다는 바로 그 장면입니다. 기독교가 박해받던 시절이라, 신자들은 이 바티칸 언덕에 그를 몰래 묻고 숨어서 기도했습니다.", "그로부터 약 이백오십년 뒤, 기독교를 공인한 콘스탄티누스 황제가 그 무덤 위에 성당을 짓기로 합니다. 문제는 땅이었습니다. 이곳은 경사진 언덕이었고, 주변에는 로마인들의 공동묘지까지 있었죠. 평지에 짓는 게 훨씬 쉬웠을 겁니다. 하지만 황제는 고집을 꺾지 않았습니다. 아마 이렇게 말하지 않았을까요? \"다른 데 지을 거면 의미가 없다. 무덤이 무조건 제단 한가운데 오게 하라!\" 결국 언덕을 깎고, 묘지를 흙으로 메워 평평하게 만든 다음에야 첫 성당을 세울 수 있었습니다.", "그 뒤 천이백년이 흘러 낡은 성당을 허물고 지금의 대성당을 지을 때도 원칙은 딱 하나였습니다. \"아무리 크고 화려하게 지어도, 베드로의 무덤 위치는 바꾸지 않는다.\"", "그래서 지금 이 성당은 하나의 축으로 꿰어져 있습니다. 맨 아래 땅속에 베드로의 무덤, 그 위에 교황이 미사를 드리는 제단, 그 위를 덮은 청동 천막, 그리고 그 위로 하늘을 향해 솟은 거대한 돔까지. 전부 정확히 한 줄로 서 있죠. \"이 바위 위에 교회를 세우리라\"는 말씀을, 이천년에 걸쳐 문자 그대로 실현한 겁니다."], "pos": [41.90226, 12.45345], "src": "audio/v/3-5.mp3", "dur": 103.4}, {"id": "3-6", "ch": "3. 성 베드로 대성당", "title": "바그다드 비단에서 온 이름, 발다키노", "text": ["제단 위를 덮고 있는 거대한 청동 구조물을 보세요. 딱딱한 청동인데, 꼭대기 가장자리는 바람에 살랑이는 천막처럼 보이지 않나요? 이것의 이름은 '발다키노'입니다.", "발다키노는 원래 왕이나 교황 머리 위에 받쳐 들던 천 덮개를 말합니다. 재밌는 건 이 단어의 뿌리인데요, 중세 이탈리아 사람들은 바그다드를 '발다코'라고 불렀고, 거기서 들여온 고급 비단을 '발다키노'라고 했습니다. 그러니까 이 거대한 청동 덩어리의 이름이 사실은 '바그다드산 비단'인 셈이죠.", "높이는 약 이십구 미터. 아파트 십 층 높이에 달하고, 세계에서 가장 큰 청동 구조물로 꼽힙니다. 이걸 만든 사람은 광장을 설계한 베르니니입니다. 당시 겨우 이십 대 중반이었죠.", "네 개의 기둥을 보세요. 곧게 뻗지 않고 꽈배기처럼 꼬여 올라가죠? 옛 예루살렘 솔로몬 성전의 기둥 모양을 본뜬 겁니다. 기둥에는 포도 덩굴이 감겨 있고, 그 사이에서 아기 천사들이 놀고 있습니다.", "그리고 기둥 곳곳에 꿀벌이 숨어 있습니다. 첨부한 사진을 봐주세요. 이 공사를 주문한 교황 우르바노 팔 세의 집안, 바르베리니 가문의 상징이 꿀벌이거든요. 요즘으로 치면 대형 협찬사 로고를 곳곳에 박아 둔 거죠. 몇 마리나 찾으시는지 한번 세어 보세요.", "이 교황은 청동이 모자라자 고대 로마 신전인 판테온 현관의 청동까지 뜯어냈습니다. 그러자 로마 시민들 사이에 이런 풍자가 돌았죠. \"야만인들도 안 한 짓을, 바르베리니가 해냈다!\" 사실 뜯어낸 청동 대부분은 대포를 만드는 데 쓰였다고 하지만, 별명은 이미 붙은 뒤였습니다.", "이제 이 천막 위, 하늘을 올려다볼까요?"], "pos": [41.90208, 12.45326], "src": "audio/v/3-6.mp3", "dur": 104.4}, {"id": "3-7", "ch": "3. 성 베드로 대성당", "title": "올려다보면 136미터, 쿠폴라", "text": ["고개를 들어 보세요. 거대한 돔, 이탈리아어로 '쿠폴라'입니다. 로마 시내 어디서든 보이는 바로 그 돔이죠. 바닥에서 꼭대기 십자가까지 백삼십육 미터가 넘습니다. 지금까지도 세계에서 가장 높은 돔입니다.", "이 돔을 설계한 사람이 바로 미켈란젤로입니다. 일흔이 넘은 나이에 이 공사를 맡았죠. 하지만 그는 돔이 완성되는 걸 보지 못했습니다. 그가 세상을 떠나고 이십육년이 지난 천오백구십년에야 제자들이 돔을 덮었죠. 자기가 그린 설계도가 하늘에 걸리는 날을 보지 못한 셈이니, 조금 짠하죠.", "돔 안쪽의 그림들을 보세요. 붓으로 그린 것처럼 보이지만, 사실 전부 작은 돌과 유리 조각을 붙인 모자이크입니다. 왜 그림이 아니라 모자이크일까요? 이렇게 큰 공간은 습기와 촛불 그을음에 약해서 물감은 금방 상하는데, 모자이크는 수백년이 지나도 색이 그대로 남거든요.", "돔 아래쪽을 빙 두른 금색 띠에 검은 글씨가 보이시죠? 글자 하나가 사람 키만 합니다. 라틴어로 아까 들은 그 말씀이 적혀 있죠. \"너는 베드로다. 이 바위 위에 내 교회를 세우리라. 너에게 하늘나라의 열쇠를 주겠다.\" 자, 여기서 두 번째 열쇠가 나왔습니다.", "돔 꼭대기 전망대에 올라가는 방법은 대성당 관람을 마친 뒤 들으실 수 있도록 뒤에 따로 넣어 두었습니다. 이제 돔을 떠받치고 있는 네 개의 거대한 기둥을 볼까요?"], "pos": [41.90205, 12.45345], "src": "audio/v/3-7.mp3", "dur": 89.0}, {"id": "3-8", "ch": "3. 성 베드로 대성당", "title": "네 기둥에 숨은 네 가지 성물", "text": ["돔을 떠받치는 네 개의 거대한 기둥에는 각각 커다란 성인 조각상이 서 있습니다. 첨부한 사진을 봐주세요. 이 조각들은 단순한 장식이 아니라 일종의 '힌트'입니다. 각 조각상 위쪽 발코니에 어떤 성물이 보관되어 있는지 알려 주거든요.", "먼저 천을 펼쳐 들고 달려가는 듯한 여인, 성녀 베로니카입니다. 예수가 십자가를 지고 언덕을 오를 때, 피땀으로 범벅이 된 그 얼굴을 천으로 닦아 준 여인이죠. 그 천에 예수의 얼굴이 찍혔다는 전설이 있고, 그 천이 이 위에 보관되어 있다고 합니다.", "커다란 십자가를 붙잡은 여인은 성녀 헬레나입니다. 이 성당을 처음 지은 콘스탄티누스 황제의 어머니죠. 그녀는 예루살렘 순례를 떠나 예수가 못 박힌 십자가 조각을 찾아왔다고 전해집니다.", "긴 창을 들고 두 팔을 활짝 벌린 남자는 로마 병사 롱기누스입니다. 십자가 위의 예수가 숨을 거뒀는지 확인하려고 창으로 옆구리를 찌른 사람이죠. 그때 흘러내린 피가 그의 눈에 닿자, 흐릿하던 눈이 밝아졌다고 합니다. 그는 회개하고 기독교인이 되었고, 그 창끝이 이 위에 있다고 하죠. 이 조각은 베르니니의 작품입니다.", "마지막으로 엑스 자 모양 십자가를 끌어안은 남자는 성 안드레아, 베드로의 형제입니다. 그는 그리스까지 가서 복음을 전하다 엑스 자 십자가에 매달려 순교했죠. 이 위에는 원래 안드레아의 머리 유해가 있었습니다. 그런데 천구백육십사년, 교황 바오로 육 세가 동방 정교회와의 화해를 위해 그 유해를 그리스로 돌려보냈습니다. 그래서 지금 이 자리는 비어 있습니다. 비워 둠으로써 화해를 기억하는 자리가 된 거죠.", "자, 이제 성당의 가장 안쪽, 금빛으로 빛나는 곳으로 가 볼까요? 발다키노 기둥 사이로 이미 보이실 겁니다."], "pos": [41.9019, 12.45355], "src": "audio/v/3-8.mp3", "dur": 110.4}, {"id": "3-9", "ch": "3. 성 베드로 대성당", "title": "빛나는 창과 베드로의 의자", "text": ["성당 가장 안쪽 벽을 보세요. 금빛 구름과 천사들 사이로, 공중에 둥실 떠 있는 듯한 거대한 청동 의자가 보이시죠? 첨부한 사진을 봐주세요. 이것도 베르니니의 작품입니다.", "먼저 가장 눈에 띄는 주황빛 창부터 볼까요? 유리 같지만, 사실 얇게 깎은 노란 돌입니다. 빛이 투과되는 '설화석고'라는 돌이죠. 창 한가운데를 보면 날개를 활짝 편 비둘기가 있습니다. 성경에서 비둘기는 '성령'을 상징하죠. 그리고 창이 열두 칸으로 나뉘어 있는데, 예수의 열두 제자를 뜻합니다. 해 질 녘 햇빛이 이 창을 통과하면 성당 안쪽이 온통 금빛으로 물듭니다.", "그 아래 청동 의자가 '성 베드로의 의자'입니다. 사실 이 청동은 일종의 보석함입니다. 안에 오래된 나무 의자가 들어 있거든요. 베드로가 앉았던 의자라고 전해졌지만, 연구해 보니 구세기 무렵 상아 장식을 붙인 의자로 밝혀졌습니다. 베드로보다 팔백년쯤 어린 셈이죠. 그래도 천백년이 넘은 의자를 이렇게 모셔 두는 건, 그 의자가 '교황의 권위', 즉 베드로의 자리를 상징하기 때문입니다.", "의자 등받이에는 부활한 예수가 베드로에게 \"내 양들을 돌보아라\"라고 말하는 장면이 새겨져 있습니다. 교회를 맡긴다는 뜻이죠.", "의자 다리를 잡고 있는 네 명의 거대한 인물들은 초기 교회의 위대한 스승 네 사람입니다. 그런데 자세히 보세요. 무거운 의자를 낑낑대며 들고 있는 게 아니라, 손끝으로 살짝 받치고 있죠? 의자가 사람의 힘이 아니라 하늘의 힘으로 떠받쳐진다는 걸 보여 주는 연출입니다.", "이제 이 의자를 바라본 채로 왼쪽 통로로 몇 걸음 가 볼까요? 문 위에 붉은 휘장과 해골이 있는 무덤이 보이실 겁니다."], "pos": [41.9022, 12.4528], "src": "audio/v/3-9.mp3", "dur": 105.4}, {"id": "3-10", "ch": "3. 성 베드로 대성당", "title": "해골이 모래시계를 든 무덤", "text": ["화려한 조각 작품 같지만, 이건 교황의 무덤입니다. 십칠세기 교황 알렉산데르 칠 세의 무덤이죠. 방금 본 베드로의 의자를 주문한 바로 그 교황입니다. 그리고 만든 사람은, 네, 또 베르니니입니다. 이쯤 되면 이 성당은 베르니니 개인전이라고 해도 될 정도죠. 이 무덤은 베르니니가 일흔이 넘어 만든 마지막 걸작 중 하나입니다.", "맨 위에서 교황이 무릎을 꿇고 기도하고 있습니다. 교황관도 벗어 둔 채, 신 앞에 선 한 사람의 인간으로요.", "그 아래에는 교황의 덕을 상징하는 네 여인이 있습니다. 아이를 안은 여인은 '사랑', 즉 자선입니다. 그리고 지구본에 발을 올린 여인은 '진리'인데요, 발끝이 지구본의 어디를 밟고 있는지 보세요. 영국입니다. 당시 가톨릭에서 갈라져 나간 영국 국교회를 향한 은근한 한 방이죠. 조각으로 하는 디스전입니다.", "이 무덤의 하이라이트는 가운데 아래쪽입니다. 붉은 휘장 아래 문이 하나 있죠? 원래 여기 있던 진짜 문입니다. 무덤을 만들 당시 성당 안에는 빈 벽이 거의 없었고, 이 문은 꼭 필요한 통로라 막을 수도 없었죠. 보통 사람이라면 포기했을 자리입니다.", "하지만 베르니니는 이 문을 작품의 핵심으로 바꿔 버립니다. 문 위를 붉은 돌 휘장으로 덮고, 그 휘장을 들추며 금빛 해골이 기어 나오게 만들었죠. 해골은 손에 모래시계를 높이 들고 있습니다. \"시간이 다 됐다\"는 거죠. 세상에서 가장 높은 교황도 죽음은 피할 수 없다, 그러니 이걸 보는 당신도 죽음을 기억하라는 메시지입니다. 진짜 문을 '이승과 저승 사이의 문'으로 만들어 버린 거죠.", "참고로 저 붉은 휘장은 대리석이 아니라 시칠리아에서 가져온 '벽옥'이라는 돌입니다. 돌로 천의 주름을 이렇게 부드럽게 만들다니, 어떤가요?", "대성당 관람은 여기까지입니다."], "pos": [41.9017, 12.45318], "src": "audio/v/3-10.mp3", "dur": 113.8}, {"id": "3-11", "ch": "3. 성 베드로 대성당", "title": "꼭대기에서 보면 광장이 열쇠, 쿠폴라 전망대", "text": ["쿠폴라 전망대는 바티칸 투어의 숨은 하이라이트입니다. 앞에서 말씀드렸듯이 전부 걸어서 올라가는 오백오십일 계단 코스와, 엘리베이터로 중간까지 올라간 뒤 삼백이십 계단을 걷는 코스가 있습니다. 오후에 박물관을 걸으실 거라면 엘리베이터를 추천드려요. 다리는 아껴 두셔야 합니다.", "엘리베이터에서 내리면 먼저 돔 안쪽 난간으로 나옵니다. 아까 아래에서 올려다본 모자이크와 사람 키만 한 글씨를 바로 눈앞에서 볼 수 있죠. 아래를 내려다보면 사람들이 개미처럼 보일 겁니다.", "그다음부터는 계단입니다. 돔의 곡선을 따라 올라가기 때문에 위로 갈수록 벽이 기울어지고, 통로는 한 사람이 겨우 지나갈 만큼 좁아집니다. 몸이 비스듬히 기울어진 채로 걷게 되니, 폐소공포증이 있으신 분은 조금 각오하셔야 해요.", "드디어 꼭대기에 나오면, 로마가 삼백육십 도로 펼쳐집니다. 이제 광장을 내려다보세요. 첨부한 사진을 봐주세요. 무엇처럼 보이시나요? 타원형 광장이 손잡이 머리, 그리고 광장에서 길게 뻗은 길이 열쇠의 몸통 같지 않나요? 그래서 위에서 본 성 베드로 광장을 '열쇠 모양'이라고들 하죠. 오늘의 세 번째 열쇠입니다. 바티칸 국기에도 교차한 열쇠 두 개가 그려져 있으니, 이 나라는 정말 열쇠에 진심인 나라입니다.", "그리고 로마 시내를 둘러보면 이 돔보다 높은 건물이 보이지 않습니다. 법으로 정해진 건 아니지만, 로마 역사 지구에서는 오랫동안 이 돔보다 높이 짓지 않는 것이 관례처럼 지켜져 왔거든요.", "내려오는 길에 대성당 지붕 위 테라스에서 광장 쪽 거대한 성인 조각상들을 뒤에서 볼 수도 있습니다."], "pos": [41.9025, 12.45325], "src": "audio/v/3-11.mp3", "dur": 98.5}, {"id": "3-12", "ch": "3. 성 베드로 대성당", "title": "갓 쓴 성인, 김대건 신부", "text": ["유럽에 와서 내내 서양 성인 조각들만 보다가, 갑자기 갓을 쓰고 도포를 입은 분을 만나면 반가우면서도 신기하실 겁니다. 대성당 오른쪽 바깥벽 높은 곳, 움푹 들어간 벽감을 봐주세요. 첨부한 사진을 봐주세요. 받침대에 한글로 이렇게 적혀 있습니다. \"성 김대건 안드레아 사제 순교자.\"", "김대건 신부는 한국 최초의 가톨릭 사제입니다. 열다섯 살에 마카오로 유학을 떠나 신학을 공부했고, 라틴어, 프랑스어, 중국어를 할 줄 알았죠. 사제가 되어 돌아온 그는 천팔백사십육년, 서양 선교사들이 몰래 조선에 들어올 바닷길을 알아보다 체포됩니다.", "조선 조정은 그의 외국어 실력과 세계 지리 지식에 깜짝 놀랐습니다. 그래서 \"나라를 위해 일하면 살려 주겠다\"고 했지만, 그는 신앙을 버리지 않았습니다. 처형 직전, 그는 이렇게 말했다고 전해집니다. \"나는 천주를 위해 죽는다. 이제 나에게 영원한 생명이 시작된다. 여러분도 죽은 뒤에 행복하려면 천주를 믿으시오.\" 그리고 목을 벨 사람에게 \"이렇게 하면 베기 좋겠느냐?\"라고 물었다고 하죠. 그때 그의 나이 겨우 스물다섯이었습니다.", "이 성상은 이천이십삼년 구 월, 그가 순교한 지 백칠십칠년이 되는 날에 축복식을 열었습니다. 높이 삼 미터가 넘는 카라라 대리석 상으로, 한국 조각가 한진섭 작가가 만들었죠. 이 대성당 바깥벽 벽감에는 주로 유럽의 수도회를 세운 성인들이 서 있는데, 동양인 성인의 상이 놓인 건 처음이라고 합니다.", "조선의 한 청년이 목숨 걸고 지킨 믿음이, 이백년 가까운 시간과 수만 킬로미터를 건너 지금 이 성당 벽에 서 있다는 것. 왠지 뭉클하지 않으세요?"], "pos": [41.903, 12.4533], "src": "audio/v/3-12.mp3", "dur": 108.3}, {"id": "3-13", "ch": "3. 성 베드로 대성당", "title": "박물관으로 가는 길", "text": ["이제 바티칸 박물관으로 이동하겠습니다. 박물관 입구는 대성당과 붙어 있지 않습니다. 대성당을 바라보고 오른쪽 회랑 바깥으로 나가, 회랑을 따라 북쪽으로 걸어가세요. '포르타 안젤리카' 거리를 지나 '리소르지멘토 광장'까지 간 다음, 높은 바티칸 성벽을 따라 쭉 걸으면 박물관 입구가 나옵니다. 일 킬로미터 정도, 걸어서 십오 분에서 이십 분 걸립니다. 첨부한 지도를 봐주세요.", "가는 길 내내 옆에 있는 높은 성벽이 바로 국경입니다. 담 하나를 사이에 두고 이쪽은 이탈리아, 저쪽은 바티칸이죠. 세계에서 가장 걷기 쉬운 국경선입니다.", "예약 시간까지 여유가 있다면 이 근처에서 점심을 드세요. 박물관 안에 들어가면 서너 시간은 쉬지 않고 걸으실 테니까요. 화장실도 미리 다녀오시면 좋습니다.", "박물관 입구에 도착하시면 예약자 줄로 가서 바우처의 큐알 코드를 찍고 보안 검색을 통과하세요."], "pos": [41.9033, 12.4566], "src": "audio/v/3-13.mp3", "dur": 57.1}, {"id": "4-1", "ch": "4. 바티칸 박물관 ① 회화관", "title": "박물관 입장, 회화관부터 들르세요", "text": ["바티칸 박물관에 오신 걸 환영합니다! 이곳은 사실 하나의 박물관이 아니라, 교황들이 오백년 동안 모은 수십 개의 박물관과 갤러리가 이어진 거대한 단지입니다. 전시실을 전부 이으면 칠 킬로미터가 넘는다고 하니, 하루에 다 보는 건 불가능하죠. 그래서 오늘은 핵심만 골라 걷겠습니다.", "대부분의 관람객은 표지판을 따라 곧장 시스티나 성당으로 향합니다. 그런데 그 길목 초입에 많은 분들이 그냥 지나치는 보물 창고가 있습니다. 바로 그림만 모아 둔 '피나코테카', 회화관입니다. 레오나르도 다 빈치, 라파엘로, 카라바조의 그림이 여기 있는데도 사람은 훨씬 적죠.", "회화관은 십이세기부터 십구세기까지의 그림을 시대 순서대로 걸어 두었습니다. 방을 하나씩 지날 때마다 그림이 어떻게 변하는지 보시면, 서양 미술 팔백년을 삼십 분 만에 훑는 셈입니다. 그림 위치는 가끔 바뀌니, 특정 작품이 안 보이면 다음 방으로 넘어가셔도 괜찮습니다."], "pos": [41.9066, 12.4536], "src": "audio/v/4-1.mp3", "dur": 60.4}, {"id": "4-2", "ch": "4. 바티칸 박물관 ① 회화관", "title": "온통 금빛인 이유, 1관", "text": ["첫 번째 방입니다. 둘러보시면 액자도 없이 두꺼운 나무판에 그린 그림들이 대부분이죠. 인물들은 표정이 없고, 몸은 뻣뻣하고, 배경은 온통 금색입니다.", "이걸 보고 \"옛날 사람들은 그림을 못 그렸구나\" 하시면 오해입니다. 이 시대 화가들의 목표는 현실을 똑같이 그리는 게 아니었거든요. 금은 녹슬지도 썩지도 않습니다. 그래서 금빛 배경은 변하지 않는 하늘나라, 신의 세계를 뜻했죠. 사실적으로 그리는 것보다 '거룩하게' 보이는 게 더 중요했던 겁니다.", "이 방에서 만화처럼 보는 그림을 하나 찾아볼까요? 작은 그림 여러 칸이 한 줄로 이어진 작품이 있습니다. 첨부한 사진을 봐주세요. 십사세기 화가 베르나르도 다디가 그린 '성 스테파노 이야기'입니다. 스테파노는 기독교 역사상 첫 번째 순교자인데, 왼쪽부터 순서대로 그가 돌에 맞아 순교하는 장면, 그 뒤 그의 시신을 찾아 로마로 모셔 오기까지의 이야기가 이어집니다. 글을 못 읽는 사람이 많던 시절, 그림은 일종의 웹툰이었던 셈이죠.", "자, 이제 다음 방으로 가 볼까요? 방 한가운데 앞뒤로 그림이 그려진 커다란 제단화가 있습니다."], "pos": [41.9059, 12.4536], "src": "audio/v/4-2.mp3", "dur": 72.7}, {"id": "4-3", "ch": "4. 바티칸 박물관 ① 회화관", "title": "그림 속에 그림이 있다, 조토의 양면 제단화", "text": ["두 번째 방 한가운데, 금빛 제단화가 서 있죠? 첨부한 사진을 봐주세요. 서양 미술의 아버지라 불리는 조토와 그의 제자들이 천삼백이십년 무렵 그린 작품입니다. 옛 성 베드로 대성당의 제단을 장식하던 그림이었죠.", "이 작품의 특징은 앞뒤 양쪽에 다 그림이 있다는 겁니다. 제단 앞쪽에는 신자들이 보는 면이, 뒤쪽에는 제단에서 미사를 드리는 성직자가 보는 면이 있었던 거죠.", "한쪽 면 가운데에는 왕좌에 앉은 베드로가 있습니다. 그 발치에 무릎 꿇은 사람을 자세히 보세요. 이 그림을 주문한 스테파네스키 추기경인데, 손에 작은 그림을 들고 있죠? 바로 이 제단화의 미니어처입니다. \"교황님, 제가 이 그림을 바칩니다\" 하는 장면을 그림 안에 넣은 거죠. 그림 속에 그림이 있고, 그 그림 속에도 그림이 있는 셈입니다.", "반대쪽 면으로 돌아가 보세요. 가운데에는 예수가 앉아 있고, 왼쪽에는 십자가에 거꾸로 매달린 베드로, 오른쪽에는 목이 베이는 바오로가 그려져 있습니다. 로마 교회의 두 기둥인 두 사도의 순교 장면이죠.", "그리고 일 관 그림들과 비교해 보세요. 배경은 여전히 금색이지만, 인물들 얼굴에 슬픔과 경외감 같은 감정이 생겼고, 몸에도 부피감이 느껴지죠? 조토는 그림 속 인물에게 처음으로 '사람의 무게'를 준 화가입니다. 신의 세계만 그리던 그림이 조금씩 사람 쪽으로 고개를 돌리기 시작한 순간이죠."], "pos": [41.9058, 12.45375], "src": "audio/v/4-3.mp3", "dur": 89.1}, {"id": "4-4", "ch": "4. 바티칸 박물관 ① 회화관", "title": "천사들의 콘서트, 4관~7관", "text": ["방을 지나며 그림이 점점 밝아지는 게 느껴지시나요? 십오세기, 르네상스가 시작되면서 금빛 배경이 사라지고, 진짜 하늘과 건물과 원근법이 그림 속으로 들어옵니다.", "사 관에서는 이 방의 아이돌들을 꼭 만나 보세요. 악기를 연주하는 천사들입니다. 첨부한 사진을 봐주세요. 십오세기 화가 멜로초 다 포를리가 로마의 한 성당 천장에 그린 벽화인데, 성당을 고칠 때 벽화를 조각조각 떼어 내 이렇게 남겼습니다. 류트를 켜는 천사, 바이올린 비슷한 악기를 켜는 천사, 바람에 날리는 곱슬머리와 발그레한 볼까지. 엽서나 기념품에서 자주 보이는 바로 그 천사들이죠.", "같은 방에는 교황 식스토 사 세가 바티칸 도서관장을 임명하는 장면을 그린 벽화도 있습니다. 이 식스토 사 세가 누구냐면, 오늘의 종착지인 '시스티나' 성당을 지은 교황입니다. 시스티나라는 이름이 바로 '식스토의'라는 뜻이거든요. 미리 얼굴을 익혀 두세요.", "칠 관으로 가시면 라파엘로의 스승인 페루지노의 그림들이 있습니다. 좌우가 똑같은 안정된 구도, 뒤로 펼쳐진 잔잔한 이탈리아 풍경. 바로 다음 방에서 만날 제자가 이 스승을 어떻게 뛰어넘는지 비교해 보시면 재밌을 거예요."], "pos": [41.9057, 12.4536], "src": "audio/v/4-4.mp3", "dur": 76.1}, {"id": "4-5", "ch": "4. 바티칸 박물관 ① 회화관", "title": "스무 살과 서른일곱 살의 라파엘로, 8관", "text": ["이 방은 오직 한 사람, 라파엘로를 위한 방입니다. 첨부한 사진을 봐주세요.", "라파엘로는 미켈란젤로, 레오나르도 다 빈치와 함께 르네상스 삼 대 거장으로 불립니다. 그런데 두 사람이 고집 세고 괴팍한 천재였다면, 라파엘로는 잘생기고 사교성 좋은 인기인이었죠. 교황청에서 일거리가 끊이지 않았습니다.", "이 방에는 그의 처음과 끝이 함께 걸려 있습니다. 먼저 '성모의 대관'. 라파엘로가 스무 살 안팎에 그린 그림입니다. 옆 방에서 본 스승 페루지노의 그림과 꽤 닮았죠? 아직은 스승의 그림자가 보입니다.", "그리고 이 방의 주인공, '그리스도의 변모'입니다. 그림이 위아래로 나뉘어 있죠. 위쪽에는 산 위에서 눈부신 빛에 휩싸여 떠오르는 예수, 아래쪽에는 귀신 들린 소년을 두고 어쩔 줄 모르는 제자들과 사람들이 있습니다. 위는 고요하고 밝은 하늘, 아래는 어둡고 혼란한 땅. 이 강렬한 대비가 나중에 '바로크'라는 새로운 미술의 씨앗이 되죠.", "이 그림은 라파엘로의 마지막 작품입니다. 천오백이십년, 그는 서른일곱 살의 나이에 열병으로 갑자기 세상을 떠났습니다. 그의 시신 머리맡에 바로 이 그림이 놓였다고 하죠. 조문객들은 죽은 화가와 그의 마지막 그림을 함께 보며 눈물을 흘렸다고 합니다.", "참고로 라파엘로는 시스티나 성당 벽 아래쪽에 걸 거대한 태피스트리, 그러니까 실로 짠 그림의 밑그림도 그렸습니다. 이 태피스트리들은 교대로 전시되거나 다른 곳에 나가 있을 때가 많아서, 이 방에 걸려 있다면 운이 좋은 날입니다."], "pos": [41.90562, 12.45378], "src": "audio/v/4-5.mp3", "dur": 97.6}, {"id": "4-6", "ch": "4. 바티칸 박물관 ① 회화관", "title": "구두 수선공의 의자가 된 다 빈치, 9관", "text": ["구 관에는 레오나르도 다 빈치의 '광야의 성 히에로니무스'가 있습니다. 첨부한 사진을 봐주세요. 보시다시피 미완성입니다. 색도 다 칠하지 않았고, 밑그림 선이 그대로 드러나 있죠.", "그런데 오히려 그래서 재밌습니다. 다 빈치가 어떻게 그림을 시작했는지 그 과정이 보이거든요. 고행하는 성인의 비쩍 마른 목과 어깨 근육을 보세요. 다 빈치는 그림을 그리기 위해 실제로 사람의 시신을 해부하며 근육을 연구했습니다. 발치에 웅크린 사자는 아직 윤곽만 있는데도 살아 있는 것 같죠.", "왜 완성하지 않았을까요? 다 빈치는 화가이자 과학자, 발명가였습니다. 머릿속의 완벽한 그림을 다 그리기도 전에 관심이 다른 연구로 옮겨 가기 일쑤였죠. 그래서 그의 작품 중에는 의외로 미완성이 많습니다. 천재의 산만함이랄까요?", "이 그림에는 믿기 힘든 사연이 전해집니다. 이 그림은 한때 여러 조각으로 잘려 있었거든요. 십구세기 초, 나폴레옹의 외삼촌이자 미술품 수집가였던 페슈 추기경이 로마의 한 고물상에서 상자 뚜껑으로 쓰이던 나무판을 발견합니다. 그런데 그게 이 그림의 몸통 부분이었던 거죠! 머리 부분은 없었습니다. 추기경은 몇년 동안 로마를 뒤진 끝에, 한 구두 수선공 가게에서 의자 상판으로 쓰이던 머리 부분을 찾아냈다고 합니다.", "다 빈치의 그림 위에 앉아서 구두를 고쳤다니, 아마 세상에서 가장 비싼 의자였을 겁니다. 그렇게 다시 합쳐진 그림은 천팔백오십육년 교황의 소장품이 되어 지금 우리 앞에 있습니다."], "pos": [41.90552, 12.45362], "src": "audio/v/4-6.mp3", "dur": 95.0}, {"id": "4-7", "ch": "4. 바티칸 박물관 ① 회화관", "title": "빛과 어둠의 무대, 10관~12관", "text": ["십 관부터는 분위기가 확 달라집니다. 이탈리아 북쪽의 물의 도시 베네치아 화가들, 티치아노와 베로네세의 그림이 기다리고 있죠. 피렌체 화가들이 정확한 선과 형태를 중시했다면, 베네치아 화가들은 빛과 화려한 색을 중시했습니다. 그림 앞에 서면 색이 반짝이는 것 같죠?", "그리고 십이 관에서 회화관의 마지막 하이라이트를 만납니다. 카라바조의 '그리스도의 매장'입니다. 첨부한 사진을 봐주세요.", "어둠 속에서 갑자기 조명을 켠 것처럼, 인물들만 환하게 떠오르죠? 숨진 예수를 무덤에 내려놓는 순간입니다. 그런데 시신을 들고 있는 남자의 맨발과 거친 손을 보세요. 성인이라기보다 로마 뒷골목에서 막 데려온 일꾼 같습니다. 실제로 카라바조는 거리의 평범한 사람들을 모델로 썼습니다. 성스러운 이야기를 우리 이웃의 얼굴로 그린 거죠. 당시엔 엄청난 충격이었습니다.", "카라바조 본인도 만만치 않은 인물이었는데요. 칼부림으로 사람을 죽이고 도망 다니며 그림을 그렸던 화가입니다. 그림만큼 인생도 명암이 극단적이었죠.", "자, 정리해 볼까요? 금빛 나무판에서 시작해, 조토가 사람의 무게를 주고, 라파엘로가 완벽한 조화를 이루고, 카라바조가 극적인 빛과 어둠으로 감정을 터뜨렸습니다. 우리는 방금 서양 미술 팔백년의 진화를 걸어서 지나온 겁니다.", "회화관을 나와 탁 트인 정원으로 가 볼까요?"], "pos": [41.90545, 12.4538], "src": "audio/v/4-7.mp3", "dur": 87.2}, {"id": "5-1", "ch": "5. 바티칸 박물관 ② 솔방울 정원과 고대 조각", "title": "4미터짜리 솔방울과 금빛 지구", "text": ["박물관 안에 이렇게 탁 트인 정원이 있다니 신기하죠? 정면을 보시면 이 정원의 별명이 왜 '솔방울 정원'인지 바로 아실 겁니다. 거대한 벽감 한가운데에 높이 사 미터 가까운 청동 솔방울이 서 있죠. 첨부한 사진을 봐주세요.", "이 솔방울은 정원보다 훨씬 나이가 많습니다. 일에서 이세기 고대 로마 시대에 만들어졌죠. 원래는 판테온 근처에서 물을 뿜던 분수의 일부였다고 합니다. 그 동네 이름이 지금도 '피냐', 이탈리아어로 '솔방울'입니다. 동네 이름이 될 만큼 유명한 솔방울이었던 거죠. 중세에는 옛 성 베드로 대성당 앞마당으로 옮겨졌고, 천육백팔년에 지금 이 자리에 자리 잡았습니다. 단테가 '신곡'에서 거인의 얼굴 크기를 이 솔방울에 비유했을 정도로, 중세 사람들에게도 유명한 랜드마크였죠.", "솔방울 양옆의 청동 공작새 두 마리도 보세요. 공작은 고대에 '죽지 않는 생명'을 상징했습니다. 늘 푸른 소나무의 열매인 솔방울과 함께, 둘 다 '영원'을 이야기하고 있는 셈이죠. 참고로 지금 보이는 공작은 복제품이고, 진품은 박물관 안에 따로 모셔져 있습니다.", "이제 몸을 돌려 정원 한가운데를 보세요. 완전히 다른 시대의 작품이 있습니다. 매끈한 금빛 구가 여기저기 찢어지고 갈라져, 그 속의 톱니바퀴 같은 기계가 드러나 있죠. 천구백구십년 이탈리아 조각가 아르날도 포모도로가 만든 '구 안의 구'입니다. 첨부한 사진을 봐주세요. 이 구는 안에 장치가 있어서 실제로 빙글 돌아가기도 합니다.", "표면에 지금 여러분의 모습과 로마의 하늘이 일그러진 채 비치죠? 작가는 이 작품을 두고 \"우리 시대의 균열과 파괴의 가능성\"을 보았다고 말했습니다. 겉은 매끈하고 번쩍이지만 속은 금이 가고 있는 세상, 어쩌면 지금 우리의 모습일지도 모르죠.", "이천년 전 사람들이 꿈꾼 '영원'의 솔방울, 그리고 오늘날 우리가 마주한 '균열'의 지구. 두 작품이 한 정원에서 서로를 마주 보고 있습니다. 잠시 벤치에 앉아 숨을 고르셔도 좋습니다. 다리 쉬어 가시는 것도 투어의 일부니까요."], "pos": [41.90535, 12.4544], "src": "audio/v/5-1.mp3", "dur": 129.1}, {"id": "5-2", "ch": "5. 바티칸 박물관 ② 솔방울 정원과 고대 조각", "title": "피오와 클레멘티노는 누구일까?", "text": ["이제부터 들어갈 곳은 '피오 클레멘티노 박물관'입니다. 이름이 좀 어렵죠? 이건 두 교황의 이름을 합친 겁니다. 클레멘스 십사 세와 비오 육 세. 이탈리아어로 하면 '클레멘티노'와 '피오'죠.", "십팔세기 이탈리아에는 고대 유물 발굴 붐이 일었습니다. 땅만 파면 그리스·로마 시대 조각상이 쏟아져 나왔죠. 마침 영국을 비롯한 유럽 귀족 자제들이 교양 여행 삼아 이탈리아를 도는 '그랜드 투어'가 유행했는데, 이들이 이 조각상들을 돈을 주고 사서 자기 나라로 실어 갔습니다. 요즘으로 치면 해외 컬렉터들이 국보급 유물을 싹쓸이해 가는 상황이었던 거죠.", "그래서 천칠백칠십일년, 클레멘스 십사 세가 결심합니다. \"이 유물들을 교황청이 사들여서 모두가 볼 수 있게 하자.\" 그리고 그 뒤를 이은 비오 육 세가 이 계획을 크게 키워, 지금 같은 웅장한 박물관을 완성했습니다. 그냥 창고가 아니라, 전시실 자체가 예술품인 박물관이죠. 공공 박물관이라는 개념이 막 생겨나던 시절, 그 시작을 연 곳 중 하나입니다.", "이곳은 인간의 몸을 가장 아름답게 표현한 고대 조각들의 집입니다. 먼저 팔각형 안뜰로 가 볼까요?"], "pos": [41.906, 12.45455], "src": "audio/v/5-2.mp3", "dur": 74.1}, {"id": "5-3", "ch": "5. 바티칸 박물관 ② 솔방울 정원과 고대 조각", "title": "미켈란젤로가 달려간 발굴 현장, 팔각 정원", "text": ["팔각형으로 둘러싸인 안뜰에 들어오셨나요? 이곳은 십육세기 초 교황 율리오 이 세가 자기가 아끼는 고대 조각들을 모아 둔 정원이었습니다. 바티칸 박물관의 씨앗이 바로 여기서 시작됐죠. 모서리마다 걸작이 하나씩 서 있습니다.", "먼저 거대한 뱀 두 마리와 사투를 벌이는 세 사람, '라오콘'입니다. 첨부한 사진을 봐주세요. 트로이 전쟁 때, 그리스군이 남긴 목마를 성 안에 들이지 말라고 경고한 사제 라오콘과 두 아들이 신이 보낸 바다뱀에게 공격당하는 장면이죠. 뒤틀린 근육, 솟아오른 핏줄, 고통으로 일그러진 얼굴. 이천년 전 조각이라고 믿기 어렵습니다.", "이 조각은 천오백육년 일 월, 로마의 한 포도밭에서 땅을 파다 발견됐습니다. 소식을 들은 교황 율리오 이 세는 곧장 전문가를 현장에 보냈는데, 그중 한 명이 서른 살의 미켈란젤로였습니다. 흙 속에서 드러나는 라오콘의 근육을 본 미켈란젤로의 심장이 얼마나 뛰었을까요? 이 조각의 꿈틀거리는 근육은 훗날 그의 작품 곳곳에 다시 살아납니다.", "그 옆 모서리에는 '아폴로 벨베데레'가 있습니다. 활을 막 쏜 뒤의 모습으로, 수백년 동안 '가장 완벽한 남자의 몸'의 기준으로 꼽힌 조각이죠. 율리오 이 세가 교황이 되기 전부터 개인적으로 소장하던 작품이었습니다.", "그런데 십팔세기 말, 이 아폴로가 사라집니다. 이탈리아를 침공한 나폴레옹이 라오콘과 함께 파리로 가져가 버렸거든요. 텅 빈 자리를 채우기 위해 교황은 당대 최고의 조각가 카노바에게 새 조각을 주문합니다. 그게 바로 메두사의 머리를 들고 있는 '페르세우스'입니다. 나폴레옹이 몰락한 뒤 아폴로는 천팔백십육년 무사히 돌아왔지만, 페르세우스도 워낙 훌륭해서 쫓겨나지 않고 지금까지 자리를 지키고 있죠. 원래 대타였는데 주전이 돌아와도 계속 뛰는 선수인 셈입니다.", "다 보셨다면 다음 전시실로 이동해 주세요. 동물 조각이 가득한 방을 지나면, 천장 그림이 화려한 '뮤즈의 방'이 나옵니다."], "pos": [41.9063, 12.45445], "src": "audio/v/5-3.mp3", "dur": 121.3}, {"id": "5-4", "ch": "5. 바티칸 박물관 ② 솔방울 정원과 고대 조각", "title": "머리도 팔다리도 없는 최고의 조각, 벨베데레의 토르소", "text": ["뮤즈의 방에 오셨습니다. 고개를 들면 예술의 신 아폴로와 아홉 뮤즈가 그려진 천장화가 보이고, 벽을 따라 뮤즈 여신들의 조각이 서 있죠. 뮤즈는 시와 음악, 연극, 역사 같은 학문과 예술을 맡은 여신들입니다. 영어 '뮤직'과 '뮤지엄'이 다 이 뮤즈에서 나온 말이에요. 지금 우리는 뮤지엄의 뿌리 앞에 서 있는 셈이죠.", "하지만 이 방의 진짜 주인공은 한가운데 놓인 돌덩어리입니다. 머리도, 팔도, 다리도 없이 몸통만 남은 조각. '벨베데레의 토르소'입니다. 첨부한 사진을 봐주세요. '토르소'는 이탈리아어로 '몸통'이라는 뜻이죠.", "받침에 새겨진 글씨에 따르면, 아테네 사람 아폴로니오스가 만들었습니다. 기원전 일세기 무렵의 작품으로 보죠. 원래는 전신상이었겠지만, 천사백삼십년대 기록에 처음 등장할 때 이미 몸통만 남아 있었습니다.", "이 조각을 세상에서 가장 사랑한 사람이 미켈란젤로였습니다. 그는 이 토르소를 몇 번이고 찾아와 만지고 관찰했다고 하죠. 그래서 이 조각을 '미켈란젤로의 학교'라고 부르기도 합니다. 교황이 팔다리를 붙여 복원해 달라고 하자 \"이대로 완벽하다\"며 거절했다는 이야기도 전해지는데, 이건 사실이라기보다 전설에 가깝습니다. 하지만 그만큼 이 조각이 완벽하다는 뜻이겠죠.", "뒤틀린 허리와 꿈틀거리는 등 근육을 보세요. 얼굴이 없는데도 깊은 고뇌가 느껴지지 않나요? 이 인물이 누구인지는 지금도 논쟁 중입니다. 가장 유력한 설은 트로이 전쟁의 영웅 아이아스입니다. 동료들에게 모욕당했다고 믿고, 스스로 목숨을 끊기 직전 고뇌에 잠긴 모습이라는 거죠.", "그리고 이 토르소는 곧 다시 만나게 됩니다. 시스티나 성당 천장의 예언자들, 그리고 '최후의 심판' 속 예수와 성 바르톨로메오의 몸이 바로 이 토르소에서 나왔거든요. 이 자세를 꼭 기억해 두세요. 이따 시스티나에서 \"어, 이거 그 몸통이다!\" 하고 알아보실 수 있게요. 헤헤.", "감상을 마치셨다면 다음 방, 둥근 천장의 '원형의 방'으로 이동해 주세요."], "pos": [41.90612, 12.45488], "src": "audio/v/5-4.mp3", "dur": 124.3}, {"id": "5-5", "ch": "5. 바티칸 박물관 ② 솔방울 정원과 고대 조각", "title": "로마 판테온 축소판, 원형의 방", "text": ["들어서자마자 고대 로마 판테온 안에 순간 이동한 기분이 들지 않으세요? 둥근 돔 천장, 가운데 뚫린 둥근 창, 격자무늬 천장 장식까지, 실제로 판테온을 본떠 십팔세기에 지은 방입니다.", "먼저 발밑을 보세요. 바닥 전체가 그림이 아니라 모자이크입니다. 손톱만 한 색색의 돌을 하나하나 박아 넣었죠. 삼세기 무렵 로마에서 칠십 킬로미터쯤 떨어진 고대 목욕탕 바닥에서 떼어 와 다시 깐 겁니다. 반인반수 괴물과 바다 생물들이 뒤엉켜 싸우는 장면이 펼쳐져 있죠. 천팔백년 전 목욕탕 바닥을 우리가 지금 밟지 않고 구경하고 있는 겁니다.", "방 한가운데 거대한 붉은 보랏빛 돌 그릇이 보이시죠? 둘레가 약 십삼 미터나 되는 수반입니다. '반암'이라는 아주 단단한 돌을 통째로 깎은 건데, 고대 로마에서 이 보랏빛 반암은 황제만 쓸 수 있는 귀한 돌이었습니다. 네로 황제의 궁전에서 나왔다는 이야기가 전해져서 흔히 '네로의 욕조'라고 부르죠. 황제가 이걸 욕조로 썼다면 물 받는 데만 한나절은 걸렸을 겁니다.", "벽을 따라 서 있는 조각들 중에 유난히 번쩍이는 금빛 거인이 있습니다. 첨부한 사진을 봐주세요. 도금한 청동 헤라클레스 상입니다. 고대 청동상은 대부분 녹여서 무기나 동전으로 다시 쓰였기 때문에 남아 있는 게 거의 없습니다. 그런데 이 헤라클레스는 아주 특이한 이유로 살아남았죠.", "고대 로마인들은 벼락 맞은 물건을 신이 건드린 것으로 여겨, 함부로 쓰지 않고 정성껏 땅에 묻었습니다. 이 헤라클레스가 바로 벼락을 맞았던 거죠. 땅에 묻힌 덕분에 녹여지지 않았고, 천팔백육십사년 로마 시내 공사 중에 발견됐을 때는 '벼락 맞아 묻음'이라는 뜻의 글자가 새겨진 돌판이 덮여 있었다고 합니다. 벼락 맞고 오히려 운이 좋아진 셈이죠.", "감상하셨다면 다음 방으로 이동해 주세요."], "pos": [41.90622, 12.4551], "src": "audio/v/5-5.mp3", "dur": 116.3}, {"id": "5-6", "ch": "5. 바티칸 박물관 ② 솔방울 정원과 고대 조각", "title": "황제의 색 보라, 그리스 십자가의 방", "text": ["이 방에서 가장 먼저 눈에 들어오는 건 양쪽에 놓인 거대한 보랏빛 돌 상자 두 개일 겁니다. 고대 로마 황실 가족의 석관입니다. 아까 원형의 방에서 본 그 '황제의 돌', 반암으로 만들었죠.", "첫 번째 석관부터 보세요. 첨부한 사진을 봐주세요. 말을 탄 로마 병사들이 적들을 짓밟는 전투 장면이 새겨져 있습니다. 이건 콘스탄티누스 황제의 어머니, 성녀 헬레나의 석관입니다. 아까 대성당에서 커다란 십자가를 붙잡고 있던 그 성녀죠.", "그런데 이상하지 않나요? 기독교를 퍼뜨린 성녀의 관에 웬 전쟁 장면일까요? 학자들은 이 석관이 원래 남자 황제를 위해 만든 것이라고 봅니다. 아마 콘스탄티누스 자신을 위해 만들었는데, 그가 수도를 콘스탄티노플로 옮기면서 결국 어머니가 쓰게 된 것으로 보이죠. 아들 관에 어머니가 들어간 셈입니다.", "반대편 석관은 분위기가 완전히 다릅니다. 첨부한 사진을 봐주세요. 아기 천사들이 포도를 따고, 발로 밟아 포도즙을 짜는 평화로운 장면이죠. 콘스탄티누스의 딸 콘스탄티나의 석관입니다. 포도는 기독교에서 예수의 피, 즉 구원을 상징합니다. 이 석관은 로마 외곽에서 이곳까지 소 마흔 마리가 끌고 왔다고 하니, 무게가 상상이 가시죠?", "마지막으로 바닥 가운데의 모자이크도 보세요. 지혜의 여신 아테나의 얼굴이 있습니다. 이 방의 이름이 '그리스 십자가의 방'인 건, 방 모양이 네 팔 길이가 똑같은 그리스식 십자가 모양이기 때문입니다.", "로마 황제의 상징인 보랏빛 돌에 기독교인 황실 가족이 잠들어 있는 방. 고대 로마의 권력이 기독교와 만나는 순간을 보여 주는 공간입니다.", "자, 이제 바티칸 박물관에서 가장 길고 화려한 복도로 들어갑니다."], "pos": [41.90602, 12.4553], "src": "audio/v/5-6.mp3", "dur": 109.4}, {"id": "6-1", "ch": "6. 바티칸 박물관 ③ 교황의 복도", "title": "복도를 걷는 세 가지 방법", "text": ["이제 바티칸 박물관에서 가장 길고 화려한 구간으로 들어갑니다. 촛대의 방, 태피스트리의 방, 지도의 방까지 세 개의 긴 복도가 일자로 이어지는데, 전부 합치면 삼백 미터 가까이 됩니다. 교황들이 세계 각국의 손님들에게 교황청의 부와 안목을 자랑하려고 작정하고 꾸민 길이죠.", "걷기 전에 딱 세 가지만 기억해 주세요.", "첫째, 고개를 드세요. 이 복도의 주인공은 천장입니다. 다들 고개를 들고 입을 벌린 채 걷느라, 바티칸에서 사람 정체가 가장 심한 곳이기도 하죠. 앞사람과 부딪히지 않게 조심하시고요.", "둘째, 눈에 보이는 걸 다 믿지 마세요. 튀어나와 보이는데 사실은 평평한 그림, 사람을 따라 움직이는 듯한 눈, 인공위성도 없던 시절에 그린 정밀한 지도까지. 이 복도는 눈속임과 집념의 전시장입니다.", "셋째, 서두르지 마세요. 많은 분들이 시스티나 성당에 빨리 가려고 이 복도를 경보하듯 지나갑니다. 하지만 그건 코스 요리에서 메인만 기다리느라 전채 요리를 그냥 흘려보내는 것과 같습니다. 천천히 음미할수록 메인 요리가 더 맛있어지는 법이죠.", "자, 첫 번째 복도인 '촛대의 방'으로 들어가 볼까요?"], "pos": [41.90575, 12.4555], "src": "audio/v/6-1.mp3", "dur": 78.2}, {"id": "6-2", "ch": "6. 바티칸 박물관 ③ 교황의 복도", "title": "촛대의 방", "text": ["양쪽으로 길게 서 있는 거대한 대리석 촛대들이 보이시죠? 그래서 이름이 '촛대의 방'입니다. 이 촛대들은 고대 로마 시대의 진짜 유물입니다. 표면을 가까이서 보시면 신화 속 인물과 식물 무늬가 빈틈없이 새겨져 있죠. 이천년 전에도 촛대 하나에 이렇게 공을 들였다니, 고대 로마인들은 인테리어에 진심이었던 것 같습니다.", "이 복도는 원래 한쪽이 트인 야외 테라스였습니다. 그런데 비바람에 조각들이 상하자 십팔세기 말에 벽을 쌓아 지금 같은 실내 전시실로 바꿨죠.", "복도가 아치로 여섯 구역으로 나뉘어 있는 것도 보세요. 아치를 하나 지날 때마다 새로운 액자 속으로 걸어 들어가는 느낌이 듭니다.", "천장도 올려다보세요. 십구세기 말에 새로 그린 화려한 천장화가 이어집니다. 그런데 착시의 끝판왕은 다음 방 천장에 있으니, 다음 방에서 천장을 꼭 다시 올려다보세요."], "pos": [41.9053, 12.45555], "src": "audio/v/6-2.mp3", "dur": 54.0}, {"id": "6-3", "ch": "6. 바티칸 박물관 ③ 교황의 복도", "title": "눈이 따라오는 예수, 태피스트리의 방", "text": ["문턱을 넘자마자 조명이 어두워지죠? 벽에 걸린 거대한 천 그림들을 보호하기 위해서입니다. 이건 그림이 아니라 실로 짠 '태피스트리'입니다. 양털과 비단에, 반짝이는 부분에는 금실과 은실까지 섞어 짰죠.", "걸어가는 방향 기준으로 왼쪽 벽에는 예수의 일생이 펼쳐집니다. 라파엘로의 제자들이 밑그림을 그리고, 당시 최고의 직물 공방이 있던 벨기에 브뤼셀에서 짠 작품들이죠. 오른쪽 벽에는 십칠세기 교황 우르바노 팔 세의 일생이 걸려 있습니다. 네, 아까 대성당 발다키노에 꿀벌을 잔뜩 붙여 놓은 그 교황입니다. 여기서도 존재감이 대단하죠.", "왼쪽 벽에서 '부활' 장면을 찾아보세요. 첨부한 사진을 봐주세요. 무덤에서 일어나는 예수의 눈을 바라보면서, 그 앞을 천천히 걸어 지나가 보세요. 그리고 다시 반대로 걸어 보세요.", "어떠세요? 예수의 눈이 여러분을 따라오지 않나요? 오른쪽에서 봐도, 왼쪽에서 봐도 예수가 나를 보고 있습니다. 실과 바늘로 이런 효과를 냈다는 게 믿어지시나요? 사람이 많으면 잠깐 옆으로 비켜서서 해 보세요.", "그리고 이제 천장을 올려다보세요. 하얀 대리석 조각이 툭 튀어나와 있는 것처럼 보이죠? 그런데 속지 마세요. 저건 조각이 아니라 붓으로 그린 그림입니다. 회색과 흰색만으로 그림자까지 그려 넣어 입체처럼 보이게 한 거죠. 손만 닿으면 확인해 보고 싶을 정도입니다.", "이 실의 터널 끝에는 벽 전체가 지도인 방이 기다리고 있습니다."], "pos": [41.9047, 12.45555], "src": "audio/v/6-3.mp3", "dur": 90.8}, {"id": "6-4", "ch": "6. 바티칸 박물관 ③ 교황의 복도", "title": "120미터 이탈리아 위를 걷다, 지도의 방", "text": ["길이 백이십 미터, 지도의 방입니다. 고개를 들면 금빛 장식과 그림으로 가득 찬 천장이 끝없이 이어지고, 양쪽 벽에는 초록빛과 푸른빛의 거대한 지도 사십 점이 걸려 있죠. 첨부한 사진을 봐주세요.", "십육세기 후반, 교황 그레고리오 십삼 세의 명령으로 당대 최고의 지리학자가 이탈리아 각 지역을 직접 조사해 그렸습니다. 놀라운 건 정확도입니다. 사백오십년 전 지도라고는 믿기 어려울 만큼 정밀하죠. 산맥과 강, 도시와 마을, 바다에 떠 있는 배까지 그려져 있습니다.", "지도를 보는 요령을 알려 드릴게요. 이 복도는 이탈리아를 길게 반으로 갈라 놓은 구조입니다. 한쪽 벽에는 이탈리아 서쪽 바다에 접한 지역들이, 다른 쪽 벽에는 동쪽 바다에 접한 지역들이 그려져 있죠. 그러니까 복도 한가운데를 걷는 우리는 지금 이탈리아 반도의 등뼈인 아펜니노 산맥 위를 걷고 있는 셈입니다.", "도시들은 하늘에서 내려다본 것처럼 그려져 있습니다. 비행기는커녕 높은 건물도 없던 시절, 땅을 걸어 다니며 잰 것을 머릿속으로 '새의 눈'으로 바꿔 그린 거죠. 당시 사람들에게 이 복도는 브이알 체험관이나 다름없었을 겁니다. 걷기만 하면 이탈리아 하늘을 나는 셈이니까요.", "지도를 하나 골라 찾아보는 재미도 있습니다. 로마, 피렌체, 베네치아 등 여행하신 도시가 있다면 한번 찾아보세요. 그리고 교황이 왜 이런 복도를 만들었을지도 생각해 보세요. 당시 이탈리아 중부는 교황이 다스리는 땅이었습니다. 이탈리아 전체를 복도에 펼쳐 놓고 그 위를 걷는 교황의 기분은 어땠을까요?"], "pos": [41.90405, 12.45555], "src": "audio/v/6-4.mp3", "dur": 99.2}, {"id": "6-5", "ch": "6. 바티칸 박물관 ③ 교황의 복도", "title": "\"왔노라, 보았노라, 신이 이기셨노라\", 소비에스키의 방", "text": ["지도의 방을 나오면 커다란 방 한쪽 벽을 거의 다 차지한 그림 한 점이 기다립니다. 첨부한 사진을 봐주세요. 가로 구 미터에 가까운 이 그림의 제목은 '빈 전투의 얀 삼 세 소비에스키'. 그래서 이 방을 '소비에스키의 방'이라고 부르죠.", "천육백팔십삼년, 오스만 제국의 대군이 오스트리아 빈을 포위했습니다. 빈이 무너지면 유럽 중심부가 통째로 위험해지는 상황이었죠. 이때 폴란드 왕 얀 삼 세 소비에스키가 기병대를 이끌고 달려와 오스만 군을 무찌릅니다.", "그림 한가운데 말을 탄 왕을 보세요. 그가 누군가에게 편지를 건네고 있죠? 교황에게 승리 소식을 전하는 편지입니다. 그 내용은 이렇게 요약되어 전해집니다. \"우리는 왔노라, 보았노라, 그리고 신이 이기셨노라.\" 고대 로마의 카이사르가 남긴 \"왔노라, 보았노라, 이겼노라\"를 살짝 비튼 거죠. 승리의 공을 자기가 아니라 신에게 돌린 겸손한 패러디입니다.", "이 그림은 폴란드의 국민 화가 얀 마테이코가 빈 전투 이백 주년인 천팔백팔십삼년에 그려서 교황에게 선물한 작품입니다. 폴란드 사람들이 \"유럽을 지킨 건 우리야\"라고 말하고 싶었던 마음이 그림 크기에서도 느껴지죠.", "이제 옆방으로 가 볼까요?"], "pos": [41.90362, 12.45568], "src": "audio/v/6-5.mp3", "dur": 80.0}, {"id": "6-6", "ch": "6. 바티칸 박물관 ③ 교황의 복도", "title": "110권의 번역본이 담겼던 책장, 무염시태의 방", "text": ["벽과 천장이 온통 그림으로 덮인 이 방은 '무염시태의 방'입니다. 이름이 좀 어렵죠? '무염시태'는 \"성모 마리아는 잉태된 순간부터 죄에 물들지 않았다\"는 가톨릭의 가르침입니다.", "가장 넓은 벽의 큰 그림을 보세요. 천팔백오십사년, 교황 비오 구 세가 이 가르침을 교회의 공식 교리로 선포하는 장면입니다. 교황을 중심으로 추기경과 주교, 신학자들이 둘러싸고 있죠. 이 방은 그 선포를 기념하기 위해 꾸민 방입니다.", "방 한가운데에 화려한 책장이 하나 있습니다. 첨부한 사진을 봐주세요. 이 교리 선포문은 전 세계 여러 언어로 번역됐는데, 각국에서 보내온 번역본 백십 권을 보관하려고 프랑스 파리에서 특별히 만든 책장입니다. 진짜 책들은 지금 바티칸 도서관에 있고, 여기 있는 건 복제본이죠. 책장 자체가 하나의 보석함 같으니 한 바퀴 돌며 보세요.", "바닥에는 고대 로마의 항구 도시 오스티아에서 가져온 모자이크도 깔려 있습니다. 천장과 벽은 십구세기, 바닥은 이천년 전. 한 방에 시간이 층층이 쌓여 있는 셈이죠.", "이제 드디어 라파엘로의 방으로 갑니다. 안내판을 따라 이동해 주세요."], "pos": [41.9035, 12.45585], "src": "audio/v/6-6.mp3", "dur": 72.4}, {"id": "7-1", "ch": "7. 바티칸 박물관 ④ 라파엘로의 방", "title": "전임자가 싫어서 생긴 방", "text": ["이제 바티칸 박물관에서 가장 빛나는 공간, '라파엘로의 방'에 들어갑니다. 들어가기 전에 이 방이 어떻게 생겼는지부터 알려 드릴게요.", "이곳은 원래 교황 율리오 이 세가 살며 일하던 개인 공간이었습니다. 그런데 율리오 이 세에게는 몹시 미워하던 사람이 있었죠. 바로 바로 앞 교황이었던 알렉산데르 육 세입니다. 원래라면 전임 교황이 쓰던 방을 물려받으면 되는데, 율리오 이 세는 이렇게 말했다고 합니다. \"그 사람 얼굴을 매일 보며 살 수는 없다!\" 전임 교황의 방에 그의 초상화가 가득했거든요. 그래서 위층에 새로 방을 꾸미기로 한 거죠.", "당대 유명 화가들이 불려 와 작업을 시작했는데, 그중에 스물다섯 살의 젊은 화가가 있었습니다. 바로 라파엘로입니다. 그의 솜씨에 반한 교황은 다른 화가들이 그리던 그림까지 일부 지우게 하고, 방 전체를 이 청년에게 맡겨 버립니다. 요즘으로 치면 신입 사원에게 회사 본사 리모델링을 통째로 맡긴 셈이죠.", "그때부터 라파엘로는 서른일곱 살에 세상을 떠날 때까지 이 방들을 그렸고, 마지막 방은 그의 제자들이 완성했습니다.", "라파엘로의 방은 모두 네 개입니다. 관람 순서는 콘스탄티누스의 방, 엘리오도로의 방, 서명의 방, 보르고 화재의 방이죠. 그런데 재밌는 건, 우리가 보는 순서와 실제로 그린 순서가 다르다는 겁니다. 처음 들어갈 콘스탄티누스의 방이 가장 마지막에 완성된 방이고, 세 번째로 볼 서명의 방이 라파엘로가 가장 먼저 그린 방이죠. 방을 지날수록 젊은 라파엘로를 만나게 되는 셈입니다. 그럼 첫 번째 방으로 들어가 볼까요?"], "pos": [41.90342, 12.456], "src": "audio/v/7-1.mp3", "dur": 98.4}, {"id": "7-2", "ch": "7. 바티칸 박물관 ④ 라파엘로의 방", "title": "가짜 뉴스로 끝나는 방, 콘스탄티누스의 방", "text": ["첫 번째 방은 '콘스탄티누스의 방'입니다. 네 방 중 가장 큰 방이죠. 오늘 여러 번 만난 그 황제, 기독교를 공인하고 첫 성 베드로 성당을 지은 콘스탄티누스의 이야기를 네 벽에 그렸습니다. 이 방은 라파엘로가 갑자기 세상을 떠난 뒤, 그가 남긴 밑그림을 바탕으로 제자들이 완성했습니다.", "먼저 황제가 병사들 앞에 서서 하늘을 올려다보는 그림, '십자가의 환영'입니다. 첨부한 사진을 봐주세요. 결전을 앞둔 황제 앞에 하늘에 빛나는 십자가가 나타나는 장면이죠. \"이 표시로 승리하리라\"는 계시였다고 합니다.", "그 옆의 가장 큰 그림이 그 결전, '밀비우스 다리의 전투'입니다. 한가운데 흰 말을 타고 돌격하는 사람이 콘스탄티누스, 그리고 강물에 빠져 허우적대는 사람이 그의 라이벌 막센티우스 황제입니다. 하늘에서는 천사들이 콘스탄티누스 편을 들고 있죠. 응원단이 너무 강력합니다.", "세 번째는 '콘스탄티누스의 세례'. 황제가 왕관을 내려놓고 무릎을 꿇은 채 교황에게 세례를 받고 있습니다.", "마지막 그림이 핵심입니다. '콘스탄티누스의 기증'. 황제가 교황에게 작은 황금상을 바치고 있죠. 황제가 로마와 서쪽 세계를 다스릴 권한을 교황에게 넘겨줬다는 장면입니다. 교황이 왕처럼 땅을 다스린 근거가 바로 이 '기증 문서'였습니다.", "그런데 반전이 있습니다. 천사백사십년, 한 학자가 이 문서를 분석해 보니 문서에 쓰인 라틴어가 콘스탄티누스 시대 말투가 아니었던 겁니다. 수백년 뒤에 누군가 만든 위조 문서였던 거죠. 그러니까 이 방은 일종의 '가짜 뉴스'를 아주 웅장하게 그려 놓은 방인 셈입니다. 그림이 그려질 당시에는 이미 위조라는 주장이 나와 있었는데도 말이죠.", "천장 한가운데도 보세요. 이교도 신상이 바닥에 떨어져 산산조각 나고, 그 자리에 십자가가 서 있습니다. 기독교가 로마를 이겼다는 선언이죠.", "자, 다음 방으로 가 볼까요?"], "pos": [41.90338, 12.45585], "src": "audio/v/7-2.mp3", "dur": 119.8}, {"id": "7-3", "ch": "7. 바티칸 박물관 ④ 라파엘로의 방", "title": "그림 속에 들어간 교황, 엘리오도로의 방", "text": ["두 번째 방, '엘리오도로의 방'입니다. 이 방의 그림들은 모두 하나의 메시지를 담고 있습니다. \"교회가 위기에 처하면 하늘이 반드시 지켜 준다.\"", "정면의 '성전에서 쫓겨나는 엘리오도로'를 보세요. 첨부한 사진을 봐주세요. 오른쪽 아래, 성전의 보물을 훔치려던 엘리오도로가 하늘에서 내려온 기사와 천사들에게 혼쭐이 나 바닥에 나뒹굴고 있습니다. 교회 재산에 손대면 이렇게 된다는 경고죠.", "그런데 왼쪽을 보세요. 이 소동을 가마 위에 앉아 지켜보는 사람이 있습니다. 성경 이야기 속에 갑자기 이 방을 주문한 교황 율리오 이 세가 등장한 거죠. \"내 교회 건드리는 놈은 이렇게 된다\"고 직접 확인하러 온 것처럼요. 교황이 자기 얼굴을 그림 속에 '카메오 출연'시킨 셈입니다.", "창문이 있는 벽의 '볼세나의 미사'도 보세요. 미사 도중 빵에서 피가 흘렀다는 기적을 그린 그림인데, 여기에도 오른쪽에 무릎 꿇은 율리오 이 세가 있습니다. 그리고 그 아래를 보세요. 아까 광장에서 말씀드린 스위스 근위병들이 그려져 있습니다! 지금의 근위병 제복이 바로 이 그림을 참고해 만들어진 거죠. 비교해 보세요. 닮았나요?", "맞은편 벽은 '감옥에서 풀려나는 성 베드로'입니다. 감옥에 갇혀 잠든 베드로 앞에 천사가 나타나는데, 천사에게서 뿜어져 나오는 빛, 병사들의 횃불, 하늘의 달빛까지 세 가지 빛이 한 그림 안에 있죠. 빛을 이렇게 다룬 그림은 당시로선 처음이었습니다.", "마지막으로 출구 쪽 벽의 '레오 일 세와 아틸라의 만남'. 로마로 쳐들어오던 훈족의 왕 아틸라가 교황 레오 일 세를 만나 물러갔다는 이야기입니다. 하늘에서 칼을 든 베드로와 바오로가 나타나자 아틸라가 겁에 질려 있죠. 그런데 이 그림을 그리는 도중 율리오 이 세가 세상을 떠났습니다. 그래서 교황 레오 일 세의 얼굴이 새 교황 레오 십 세의 얼굴로 바뀌었죠. 그림 속 교황 얼굴도 정권 교체를 한 셈입니다."], "pos": [41.9034, 12.45568], "src": "audio/v/7-3.mp3", "dur": 117.4}, {"id": "7-4", "ch": "7. 바티칸 박물관 ④ 라파엘로의 방", "title": "철학, 신학, 예술, 법이 한 방에, 서명의 방", "text": ["세 번째 방, '서명의 방'입니다. 라파엘로가 이 방들 중 가장 먼저 그린 방이죠. 원래는 율리오 이 세의 서재였고, 나중에 교황청 최고 법원이 이 방에서 문서에 서명을 했기 때문에 이런 이름이 붙었습니다.", "서재였던 만큼 이 방의 네 벽에는 당시 사람들이 생각한 인간 지식의 네 분야가 그려져 있습니다.", "먼저 그리스 철학자들이 모여 있는 '아테네 학당'. 철학, 즉 인간의 이성을 상징합니다. 이 그림은 다음 트랙에서 자세히 보겠습니다.", "아테네 학당 맞은편의 '성체 논의'는 신학, 즉 신앙을 상징하죠. 위쪽 하늘에는 예수와 성모, 성인들이 앉아 있고, 아래쪽 땅에서는 교황과 신학자들이 열띤 토론을 벌이고 있습니다.", "창문 위 벽의 '파르나소스'는 예술입니다. 산꼭대기에서 악기를 켜는 음악의 신 아폴로를 아홉 뮤즈와 시인들이 둘러싸고 있죠. 아까 뮤즈의 방에서 본 그 뮤즈들입니다. 시인들 중에서 월계관을 쓴 옆모습의 단테도 찾아보세요.", "반대편 창문 위 벽은 법을 상징하는 그림입니다. 위쪽에는 용기, 지혜, 절제를 상징하는 세 여인이, 아래쪽에는 교회법과 세속법을 만드는 장면이 그려져 있죠.", "철학, 신학, 예술, 법. 이성과 신앙이 한 방에서 사이좋게 마주 보고 있습니다. 르네상스는 바로 이 둘이 함께 갈 수 있다고 믿은 시대였죠."], "pos": [41.90342, 12.45552], "src": "audio/v/7-4.mp3", "dur": 87.2}, {"id": "7-5", "ch": "7. 바티칸 박물관 ④ 라파엘로의 방", "title": "아테네 학당 속 숨은 얼굴들", "text": ["이제 이 투어에서 가장 유명한 그림 중 하나, '아테네 학당' 앞에 섰습니다. 첨부한 사진을 봐주세요. 라파엘로가 이십 대 중반에 그린 작품이죠. 고대 그리스 철학자들이 거대한 건물 안에 한자리에 모여 있습니다.", "가운데에서 나란히 걸어 나오는 두 사람을 보세요. 왼쪽에서 손가락으로 하늘을 가리키는 사람이 플라톤, 오른쪽에서 손바닥으로 땅을 누르는 듯한 사람이 그의 제자 아리스토텔레스입니다. 플라톤은 눈에 보이지 않는 이상의 세계를, 아리스토텔레스는 우리가 발 딛고 사는 현실 세계를 중요하게 여겼습니다. 두 사람이 평생 쌓은 철학을 손짓 하나로 요약해 버린 거죠. 그리고 이 둘을 중심으로 왼쪽에는 생각과 이상을 따르는 철학자들이, 오른쪽에는 수학자와 과학자들이 모여 있습니다.", "그런데 라파엘로에게는 고민이 있었습니다. 이천년 전 철학자들의 얼굴을 어떻게 그리지? 사진도 없는데 말이죠. 그래서 그는 기발한 방법을 씁니다. 자기 시대의 스타들 얼굴을 빌려 온 거죠.", "하늘을 가리키는 플라톤의 얼굴은 라파엘로가 존경하던 대선배, 레오나르도 다 빈치를 닮았다고 알려져 있습니다. 오른쪽 아래에서 허리를 숙여 컴퍼스로 무언가를 그리는 대머리 학자 유클리드는 이 대성당을 설계한 건축가 브라만테의 얼굴이죠.", "그리고 계단 앞쪽에 홀로 턱을 괴고 앉아 깊은 생각에 잠긴 남자가 보이시나요? 만물은 흐른다고 말한 철학자 헤라클레이토스인데, 얼굴의 주인은 바로 미켈란젤로입니다. 이 인물은 원래 밑그림에 없었습니다. 그런데 라파엘로가 바로 옆 시스티나 성당에서 그려지던 미켈란젤로의 천장화를 보고 크게 감동해서, 마지막에 추가로 그려 넣었다고 하죠. 성격이 까칠하기로 유명했던 미켈란젤로를 혼자 뚝 떨어져 앉은 모습으로 그린 건, 라파엘로식 유머였을지도 모릅니다.", "마지막으로 오른쪽 끝을 보세요. 검은 모자를 쓰고 우리를 똑바로 쳐다보는 젊은 남자가 있습니다. 바로 라파엘로 자신입니다. 위대한 철학자들 사이에 슬쩍 끼어 들어가 카메라를 쳐다보는 셀카. 오백년 전에도 단체 사진에 이렇게 들어가는 사람이 있었네요."], "pos": [41.9033, 12.45545], "src": "audio/v/7-5.mp3", "dur": 130.9}, {"id": "7-6", "ch": "7. 바티칸 박물관 ④ 라파엘로의 방", "title": "손짓 한 번에 불을 끈 교황, 보르고 화재의 방", "text": ["마지막 방, '보르고 화재의 방'입니다. 이 방 그림들의 주인공은 모두 '레오'라는 이름의 옛 교황들입니다. 왜일까요? 이 방을 그리던 때의 교황이 레오 십 세였거든요. 같은 이름을 가진 선배 교황들을 띄워 주면서, 은근히 지금의 레오 교황도 함께 높여 주는 거죠. 그래서 그림 속 옛 교황들 얼굴이 레오 십 세를 닮았습니다. 이 방부터는 라파엘로가 밑그림을 그리고 제자들이 많이 거들었습니다.", "이 방의 대표작 '보르고의 화재'를 보세요. 첨부한 사진을 봐주세요. 구세기, 바티칸 바로 앞 동네인 보르고에 큰불이 났습니다. 왼쪽에서는 사람들이 벽 너머로 아기를 건네고, 늙은 아버지를 업고 도망치고 있죠. 이 장면은 트로이 전쟁 때 영웅 아이네아스가 불타는 트로이에서 아버지를 업고 탈출하는 장면을 그대로 가져온 것입니다.", "그리고 저 뒤쪽, 옛 성 베드로 대성당 발코니를 보세요. 교황 레오 사 세가 손을 들어 축복을 내리자 불길이 잦아들었다는 기적을 그린 겁니다. 소방차보다 빠른 교황님이었던 셈이죠.", "다른 벽에는 이슬람 해적과 싸워 이긴 '오스티아 해전', 그리고 서기 팔백년 교황이 프랑크 왕국의 샤를마뉴에게 황제의 관을 씌워 주는 '샤를마뉴의 대관식'이 그려져 있습니다. 이 그림 속 샤를마뉴는 그림을 그릴 당시 프랑스 왕이었던 프랑수아 일 세의 얼굴이죠. 교황이 황제에게 왕관을 씌워 준다, 즉 왕도 교황이 인정해야 왕이라는 메시지입니다.", "네 방을 다 보셨습니다. 이제 드디어 오늘의 마지막 장소, 시스티나 성당으로 갑니다. 가는 길에 계단을 내려가 현대 종교 미술 전시실을 지나게 되는데, 시간이 없으시면 안내판의 '시스티나 성당' 표시를 따라 쭉 이동하세요."], "pos": [41.90345, 12.45535], "src": "audio/v/7-6.mp3", "dur": 108.5}, {"id": "8-1", "ch": "8. 시스티나 성당과 마무리", "title": "들어가기 전에, 시스티나 성당 사용법", "text": ["드디어 오늘의 마지막 장소, 시스티나 성당입니다. 들어가기 전에 몇 가지만 알려 드릴게요.", "시스티나 성당 안에서는 사진 촬영이 전면 금지이고, 조용히 해야 합니다. 경비원들이 수시로 \"노 포토! 실렌치오!\" 하고 외치죠. 그래서 이 챕터는 가능하면 성당에 들어가기 전에 미리 한 번 들어 두시고, 안에서는 첨부한 사진을 보며 다시 들으시는 걸 추천드립니다. 이어폰으로 조용히 듣는 건 괜찮습니다.", "안에 들어가면 사람이 많아서 정신이 없을 겁니다. 일단 벽 쪽 의자가 비어 있으면 얼른 앉으세요. 천장화는 목을 젖혀서 오래 봐야 하거든요. 오백년 전 미켈란젤로는 이걸 사년 동안 그렸는데, 우리는 사 분만 봐도 목이 아픕니다.", "이 성당은 십오세기 교황 식스토 사 세가 지었습니다. 회화관 사 관에서 얼굴을 미리 익혀 두셨죠? '시스티나'는 '식스토의 성당'이라는 뜻입니다. 길이 약 사십일 미터, 폭 약 십삼 미터, 높이 약 이십일 미터의 길쭉한 직사각형 건물이죠.", "그리고 이곳은 새 교황을 뽑는 '콘클라베'가 열리는 곳입니다. 전 세계 추기경들이 이 안에 모여 문을 걸어 잠그고 투표를 하죠. 굴뚝에서 흰 연기가 나면 새 교황이 뽑혔다는 뜻입니다. 지금 서 있는 이곳에서 세계 십사 억 가톨릭 신자의 지도자가 정해지는 겁니다.", "벽 중간 높이에 줄지어 있는 그림들도 놓치지 마세요. 미켈란젤로보다 먼저, 보티첼리, 그리고 라파엘로의 스승 페루지노 같은 당대 최고 화가들이 그린 모세와 예수의 일생입니다. 원래는 이 그림들이 주인공이었는데, 미켈란젤로가 등장하는 바람에 조연이 되어 버렸죠.", "오늘은 크게 두 가지를 보겠습니다. 천장화, 그리고 제단 뒤 벽 전체를 덮은 '최후의 심판'입니다. 성당에 들어가면 제단, 그러니까 '최후의 심판'이 있는 벽을 바라보고 서 주세요."], "pos": [41.90305, 12.455], "src": "audio/v/8-1.mp3", "dur": 114.4}, {"id": "8-2", "ch": "8. 시스티나 성당과 마무리", "title": "천장 가운데, 창세기 아홉 장면", "text": ["자, 고개를 들어 보세요. 첨부한 사진을 봐주세요.", "오늘 일 장에서 \"나는 화가가 아니다\"라고 외치던 조각가 이야기를 기억하시죠? 그가 천오백팔년부터 천오백십이년까지, 서른셋에서 서른일곱 살 사이에 이 천장 전체를 그렸습니다. 넓이가 테니스 코트 두 개쯤 됩니다. 그걸 거의 혼자서 그린 거죠.", "흔히 미켈란젤로가 누워서 그렸다고 알고 계시는데, 사실은 서서 그렸습니다. 직접 설계한 작업대 위에 서서, 고개를 뒤로 꺾고 팔을 위로 든 채로요. 그는 친구에게 보낸 시에 이렇게 투덜댔습니다. \"수염은 하늘을 향하고, 붓에서 떨어진 물감이 얼굴을 알록달록하게 칠한다. 나는 좋은 곳에 있지 않다. 그리고 나는 화가도 아니다.\" 시 옆에는 고개를 젖히고 천장을 그리는 자기 모습을 우스꽝스럽게 그려 놓기까지 했죠.", "천장 한가운데에는 구약성경 '창세기'의 아홉 장면이 이어집니다. 제단 쪽부터 순서대로 볼까요? 첫째, 빛과 어둠을 나누는 하느님. 둘째, 해와 달과 식물을 만드는 하느님. 셋째, 땅과 물을 나누는 하느님. 넷째, 아담의 창조. 다섯째, 하와의 창조. 여섯째, 선악과를 먹고 에덴동산에서 쫓겨나는 아담과 하와. 일곱째, 노아의 제사. 여덟째, 대홍수. 아홉째, 술에 취한 노아입니다.", "재밌는 건 미켈란젤로가 이걸 입구 쪽, 그러니까 아홉 번째 장면부터 그리기 시작했다는 겁니다. 입구 쪽 대홍수 장면을 보시면 사람들이 작고 빽빽하게 많죠? 그런데 제단 쪽으로 올수록 인물이 점점 크고 단순해집니다. 처음 그려 보는 천장화라, 아래에서 올려다보면 작은 인물은 잘 안 보인다는 걸 그리면서 깨달은 거죠. 이 천장에는 한 조각가가 화가로 성장해 가는 과정이 그대로 남아 있는 겁니다."], "pos": [41.90294, 12.45475], "src": "audio/v/8-2.mp3", "dur": 117.6}, {"id": "8-3", "ch": "8. 시스티나 성당과 마무리", "title": "2센티미터의 긴장, 아담의 창조", "text": ["아홉 장면 중 가장 유명한 그림, 네 번째 '아담의 창조'입니다. 첨부한 사진을 봐주세요. 아마 세상에서 가장 많이 패러디된 그림일 겁니다.", "왼쪽에 땅에 비스듬히 누운 아담, 오른쪽에 천사들에게 둘러싸여 날아오는 하느님. 그리고 두 사람의 손가락이 닿을 듯 말 듯 마주하고 있죠. 그 사이 간격은 이 센티미터 정도라고 합니다. 이 그림이 유명해진 이유가 바로 이 틈입니다. \"저 손가락이 닿는 순간 무슨 일이 일어날까?\" 생명이라는 전기가 찌릿 하고 흐르기 직전의 긴장감을 담은 거죠.", "아담의 손가락을 보세요. 힘없이 축 늘어져 있죠? 아직 생명이 다 들어가지 않은 몸입니다. 반면 하느님의 손가락은 힘차게 쭉 뻗어 있습니다. 생명을 주는 쪽과 받는 쪽의 차이죠.", "그리고 두 사람의 크기를 보세요. 이전의 그림에서 신은 감히 쳐다볼 수도 없는 거대한 존재였고, 인간은 그 앞에 엎드린 작은 존재였습니다. 그런데 여기서는 하느님과 아담이 거의 같은 크기로 마주 보고 있죠. 신이 자신의 모습을 본떠 인간을 만들었다는 성경 구절을, 아름다운 인간의 몸으로 증명해 보인 겁니다. 인간을 이렇게 위대하게 그린 것, 이것이 르네상스의 정신입니다.", "재밌는 비밀 두 가지. 첫째, 하느님과 천사들을 감싼 붉은 망토의 모양이 사람의 뇌 단면과 닮았다는 주장이 있습니다. 한 미국 의사가 천구백구십년에 발표한 이야기인데, 해부학을 깊이 공부한 미켈란젤로라면 일부러 그랬을지도 모른다는 거죠. 한번 보세요. 닮았나요?", "둘째, 아담의 손가락 중 일부는 미켈란젤로가 그린 게 아닙니다. 미켈란젤로가 세상을 떠난 뒤 천장에 금이 가면서 그 부분이 떨어져 나가, 다른 화가가 다시 그려 넣었거든요. 세상에서 가장 유명한 손가락이, 사실은 수리한 손가락인 셈입니다. 헤헤."], "pos": [41.9029, 12.45455], "src": "audio/v/8-3.mp3", "dur": 115.2}, {"id": "8-4", "ch": "8. 시스티나 성당과 마무리", "title": "메시아를 기다린 열두 명, 예언자와 무녀", "text": ["이제 천장 가운데에서 눈을 조금 옆으로 옮겨 볼까요? 천장 가장자리를 따라 거대한 의자에 앉은 열두 명의 거인이 보입니다. 첨부한 사진을 봐주세요. 두꺼운 책이나 두루마리를 들고, 무언가를 골똘히 생각하거나 깜짝 놀란 표정이죠.", "이들은 언젠가 구세주, 즉 메시아가 올 것이라고 예언한 사람들입니다. 가운데 그림이 인류의 시작과 타락을 보여 준다면, 이들은 \"하지만 구원은 온다\"고 말해 주는 사람들이죠.", "그런데 특이한 점이 있습니다. 일곱 명은 성경 속 이스라엘의 예언자들인데, 나머지 다섯 명은 고대 그리스·로마의 무녀, '시빌라'입니다. 기독교 성당 천장에 이교도 무당이라니, 이상하지 않나요? 르네상스 사람들은 기독교 밖의 세상도 구세주가 올 것을 예감하고 있었다고 생각했습니다. 구원은 한 민족만이 아니라 온 인류를 위한 것이라는 뜻이죠.", "대표적인 몇 명만 볼까요? 제단 바로 위, '최후의 심판' 꼭대기에 몸을 뒤로 확 젖힌 남자가 보이시죠? 커다란 물고기와 함께 있는 요나입니다. 고래 배 속에 사흘 동안 있다 살아 나온 요나는 예수가 죽은 지 사흘 만에 부활할 것을 미리 보여 주는 인물이죠. 평평한 천장인데도 요나가 우리 쪽으로 쓰러질 듯 튀어나와 보이는 건, 미켈란젤로의 원근법 솜씨 덕분입니다.", "요나 가까이 턱을 괴고 깊은 슬픔에 잠긴 노인은 예레미야입니다. 이 얼굴이 미켈란젤로 자신의 모습이라는 설도 있죠. 사년 동안 천장에 매달린 화가의 심정이 저 얼굴에 담겼을지도 모릅니다.", "그리고 여기서 아까 뮤즈의 방에서 본 몸통 조각, 벨베데레의 토르소를 기억해 보세요. 비틀린 허리, 꿈틀대는 근육. 이 예언자와 무녀들의 몸에서 그 토르소가 보이지 않나요? 한 조각가가 화가가 되어서도, 결국 조각처럼 그린 겁니다."], "pos": [41.903, 12.4544], "src": "audio/v/8-4.mp3", "dur": 110.6}, {"id": "8-5", "ch": "8. 시스티나 성당과 마무리", "title": "천장 네 모서리의 액션 영화", "text": ["이제 천장의 네 모서리를 볼까요? 삼각형으로 휘어 들어간 구석 공간들이 있죠. 그냥 두기 쉬운 자리인데, 미켈란젤로는 여기에도 네 편의 액션 영화를 그려 넣었습니다. 주제는 모두 같습니다. \"위기에 빠진 이스라엘 민족을 신이 구했다.\"", "먼저 제단 쪽 두 모서리부터 볼까요? 첨부한 사진을 봐주세요. 한가운데 한 남자가 처형당하고 있죠. 그는 하만, 유대인을 몰살하려던 페르시아의 재상입니다. 그런데 유대인 왕비 에스더가 목숨을 걸고 왕에게 그의 음모를 고발하죠. 화가 난 왕은 하만을 처형합니다. 성경에는 하만이 장대에 매달렸다고 나오는데, 미켈란젤로는 그를 십자가에 매단 모습으로 극적으로 바꿔 그렸습니다.", "제단 쪽 다른 모서리는 '구리 뱀' 이야기입니다. 광야를 헤매던 이스라엘 백성들이 신을 원망하자 독사들이 나타나 사람들을 물죠. 한쪽에는 뱀에 물려 몸부림치는 사람들이, 다른 쪽에는 모세가 장대 위에 세운 구리 뱀을 바라보며 살아나는 사람들이 그려져 있습니다. 그 구리 뱀을 바라보는 사람은 살았다고 하거든요.", "이제 몸을 돌려 입구 쪽 두 모서리를 볼까요? 한쪽은 '유딧'입니다. 이스라엘을 침략한 적장 홀로페르네스의 막사에 몰래 들어가 그의 목을 벤 여인이죠. 하녀가 머리에 인 바구니에는 잘린 머리가 담겨 있습니다. 유딧이 뒤를 돌아보는 건, 막사 안에서 목 없는 몸이 아직 꿈틀거리고 있기 때문이라는 해석도 있죠. 섬뜩하죠?", "다른 한쪽은 우리에게 익숙한 '다윗과 골리앗'입니다. 돌팔매로 거인을 쓰러뜨린 소년 다윗이 골리앗의 등에 올라타 칼을 높이 들고 있죠. 단 한 장면으로 승부가 갈리는 순간을 담았습니다.", "천장 한가운데의 큰 그림뿐 아니라 이 좁은 구석까지 영화처럼 채운 것. 미켈란젤로의 지독한 완벽주의가 느껴지시죠?"], "pos": [41.90282, 12.45425], "src": "audio/v/8-5.mp3", "dur": 113.2}, {"id": "8-6", "ch": "8. 시스티나 성당과 마무리", "title": "최후의 심판 ① 천국과 지옥 사이", "text": ["이제 시선을 제단 뒤 벽 전체로 옮겨 보세요. 첨부한 사진을 봐주세요. '최후의 심판'입니다. 미켈란젤로가 천장화를 끝내고 이십여 년이 지난 뒤, 예순한 살에 시작해 예순여섯 살에 완성한 작품이죠. 삼백 명이 넘는 인물이 벽 전체에서 소용돌이칩니다. 세상의 마지막 날, 예수가 다시 와서 모든 사람을 심판한다는 장면이죠.", "이 그림은 위에서 아래로 읽으면 됩니다.", "맨 위 양쪽 둥근 공간에는 날개 없는 천사들이 무언가를 나르고 있습니다. 왼쪽은 예수가 매달렸던 십자가, 오른쪽은 예수가 묶여 채찍질 당한 기둥이죠.", "그 아래 한가운데가 심판자 예수입니다. 우리가 흔히 보는 수염 난 온화한 예수가 아니죠? 수염도 없고, 그리스 신처럼 근육이 우람합니다. 오른손을 높이 들어 심판을 내리는 중이죠. 그 옆에서 성모 마리아는 차마 볼 수 없다는 듯 고개를 돌리고 몸을 웅크리고 있습니다.", "예수 주변에는 성인들이 둘러싸고 있는데, 다들 손에 무언가를 들고 있죠. 자기가 어떻게 순교했는지 보여 주는 물건들입니다. 석쇠를 든 성 로렌초는 불에 구워졌고, 화살 다발을 든 성 세바스티아노는 화살을 맞았고, 부서진 바퀴를 든 성녀 가타리나는 바퀴 고문을 받았죠. 그런데 다들 아파하는 게 아니라 자신을 죽인 도구를 승리의 트로피처럼 당당히 들고 있습니다.", "예수의 왼쪽, 그러니까 우리가 볼 때 오른쪽에 큰 열쇠 두 개를 든 노인이 보이시나요? 네, 베드로입니다. 오늘의 네 번째 열쇠죠. 이 열쇠는 다음 트랙에서 아주 재밌게 쓰일 겁니다.", "그리고 베드로 아래쪽, 한 손에 칼을, 다른 손에 축 늘어진 사람 가죽을 들고 있는 남자를 보세요. 산 채로 살가죽이 벗겨져 순교한 성 바르톨로메오입니다. 그런데 그 가죽의 일그러진 얼굴, 이게 바로 미켈란젤로 자신의 자화상입니다. 이 거대한 벽화를 그리며 영혼까지 탈탈 털린 자신을 벗겨진 가죽에 그려 넣은 거죠. 그리고 바르톨로메오가 앉은 자세를 보세요. 비틀린 허리, 우람한 몸통. 네, 맞습니다. 뮤즈의 방에서 본 벨베데레의 토르소입니다. 첨부한 사진을 비교해 보세요. 몸통만 남은 이천년 전 조각이, 여기서 다시 살아난 겁니다.", "이제 그림 아래쪽입니다. 왼쪽 아래에서는 죽은 사람들이 무덤에서 깨어나 해골에 살이 붙으며 일어나고, 천사들이 그들을 하늘로 끌어올리고 있습니다. 묵주 한 줄에 매달려 두 사람이 끌려 올라가는 장면도 찾아보세요. 기도의 힘으로 구원받는다는 뜻이죠.", "반대로 오른쪽은 지옥으로 떨어지는 사람들입니다. 악마에게 다리를 붙잡힌 채 한 손으로 얼굴 반쪽을 가린 남자를 보세요. 자기가 지옥에 간다는 걸 깨달은 순간의 절망. 미술사에서 '절망'을 가장 잘 그린 얼굴로 꼽힙니다. 그 아래에는 저승의 뱃사공 카론이 노를 휘두르며 배에 탄 죄인들을 지옥으로 내쫓고 있죠."], "pos": [41.90292, 12.45405], "src": "audio/v/8-6.mp3", "dur": 174.4}, {"id": "8-7", "ch": "8. 시스티나 성당과 마무리", "title": "최후의 심판 ② \"지옥은 내 관할이 아니오\"", "text": ["그림의 맨 오른쪽 아래 구석을 보세요. 당나귀 귀를 달고, 뱀이 온몸을 칭칭 감은 남자가 있습니다. 지옥의 재판관 미노스입니다. 그런데 이 미노스에는 미켈란젤로의 통쾌한 복수극이 숨어 있습니다.", "미켈란젤로가 이 그림을 처음 그렸을 때, 예수와 성인들을 포함한 삼백 명 넘는 인물이 거의 모두 벌거벗고 있었습니다. 심판대 앞에서는 지위도 재산도 없이 영혼만 남는다는 뜻이었죠. 하지만 일부 성직자들은 경악했습니다. 특히 교황의 의전관이었던 비아조라는 사람이 이렇게 비난했다고 하죠. \"이렇게 거룩한 곳에 벌거벗은 사람들을 그리다니, 이건 교회가 아니라 목욕탕이나 술집에 어울리는 그림이다!\"", "화가 난 미켈란젤로는 어떻게 했을까요? 지옥의 재판관 미노스의 얼굴을 바로 그 비아조의 얼굴로 그려 버립니다. 게다가 뱀이 그의 가장 은밀한 부위를 꽉 물고 있게 그렸죠. 영원히 지옥에서 고통받도록 박제해 버린 겁니다.", "기겁한 비아조는 교황 바오로 삼 세에게 달려가 저 얼굴을 지워 달라고 애원했습니다. 그러자 교황이 이렇게 대답했다는 일화가 전해집니다.", "\"허허, 내가 연옥까지는 힘을 좀 써 보겠네만, 지옥은 내 관할이 아니라서 어쩔 수가 없구려.\"", "자, 오늘 우리가 세어 온 열쇠들을 떠올려 보세요. 대성당의 베드로 동상, 돔의 글씨, 위에서 본 광장, 그리고 방금 이 그림 속 베드로가 든 열쇠까지. 그 열쇠는 '하늘나라'의 문을 여는 열쇠였죠. 베드로의 후계자인 교황이 가진 열쇠로 천국 문은 열 수 있어도, 지옥 문은 열 수 없다는 겁니다. 오늘 열쇠 이야기의 마지막 반전이죠. 헤헤.", "하지만 미켈란젤로도 끝까지 이기지는 못했습니다. 그가 세상을 떠나기 직전, 교회는 그림 속 벗은 몸을 가리라는 결정을 내립니다. 그리고 그가 세상을 떠난 뒤, 그를 존경하던 화가 다니엘레 다 볼테라가 인물들에게 천을 그려 입히는 일을 맡았죠. 존경하는 스승의 그림에 옷을 입혀야 했던 그는 '바지 재봉사'라는 별명을 얻게 됩니다. 이후 수백년 동안 덧칠이 더해졌다가, 천구백구십년대 복원 때 일부를 벗겨 냈습니다. 지금 보시는 그림에도 그때 입힌 천들이 남아 있으니 한번 찾아보세요.", "\"나는 화가가 아니다\"라던 조각가는 이 성당에서 천장과 벽 전체를 그림으로 채웠습니다. 그리고 그 그림 속에 자기 얼굴을, 벗겨진 가죽으로 남겼죠. 이제 이 이야기를 마음에 품고, 천천히 둘러보시기 바랍니다."], "pos": [41.9028, 12.45405], "src": "audio/v/8-7.mp3", "dur": 149.6}], "center": [41.904, 12.455]}, "c": {"name": "콜로세움", "full": "코미꼬의 콜로세움 투어", "tracks": [{"id": "1-1", "ch": "1. 미리 듣기", "title": "인삿말", "text": ["여러분은 지금 이천 년 가까이 버텨 온 세계에서 가장 유명한 경기장, 콜로세움에 와 계십니다. 아니면 가는 길이시겠죠?", "사진으로는 수백 번 봤을 거예요. 그런데 막상 앞에 서면 이런 생각이 들죠. \"크다…. 근데 이게 뭘 하던 데였지? 왜 반쪽만 남았지? 벽에 구멍은 또 왜 이렇게 많아?\"", "걱정 마세요. 제가 있잖아요?", "이 투어는 제가 직접 콜로세움을 여러 번 걸으며, 이탈리아어와 영어 자료를 하나하나 확인해서 만들었습니다. 영화 글래디에이터에서 본 장면 중에 진짜는 뭐고 가짜는 뭔지, 콜로세움이 왜 하필 이 자리에 서 있는지, 그리고 이천 년 동안 이 건물이 무슨 일을 겪었는지까지. 다 듣고 나면 콜로세움이 그냥 큰 돌덩어리가 아니라 하나의 거대한 이야기로 보이실 거예요.", "코미꼬의 로마 콜로세움 투어, 지금 바로 출발합니다!"], "pos": null, "src": "audio/c/1-1.mp3", "dur": 54.4}, {"id": "1-2", "ch": "1. 미리 듣기", "title": "단 세 문장으로 배우는 콜로세움", "text": ["본격적으로 들어가기 전에, 딱 세 문장만 기억해 주세요. 이 세 문장이면 오늘 투어가 훨씬 쉬워집니다.", "첫째. 콜로세움의 원래 이름은 '플라비우스 원형경기장'입니다. 플라비우스라는 가문의 황제, 아빠와 두 아들이 대를 이어 지었어요.", "둘째. 이 자리는 원래 폭군 네로 황제의 개인 정원 연못이었습니다. 새 황제는 그 연못을 메우고, 시민 모두가 공짜로 들어오는 경기장을 지었죠.", "셋째. 여기서 열린 쇼는 시민을 위한 '선물'이었고, 그 선물로 황제는 시민의 마음을 샀습니다.", "정리하면, 개인 연못이 시민의 놀이터가 되었고, 그 놀이터는 황제의 인기 관리 기계였다. 이 문장 하나를 오늘 투어 내내 들고 다니시면 됩니다. 참 쉽죠?"], "pos": null, "src": "audio/c/1-2.mp3", "dur": 49.0}, {"id": "1-3", "ch": "1. 미리 듣기", "title": "콜로세움을 만든 아빠와 두 아들, 그리고 미움받은 한 사람", "text": ["오늘 이야기에는 황제 네 명이 나옵니다. 이름이 길어서 헷갈리니까 별명으로 외워 볼게요.", "먼저 미움받은 한 사람, 네로. 서기 육십 사년 로마에 큰 불이 난 뒤, 불탄 시내 한복판에 '황금 궁전'이라는 어마어마한 궁전을 짓고, 그 정원에 인공 호수까지 팠습니다. 시민들 눈에는 \"우리 집은 다 탔는데 황제는 시내 한가운데 호수를 파?\"였겠죠. 결국 네로는 쫓겨나 스스로 목숨을 끊습니다.", "그다음 아빠, 베스파시아누스. 혼란을 정리하고 황제가 된 군인 출신입니다. 이분이 네로의 호수를 메우고 콜로세움 공사를 시작했어요.", "첫째 아들, 티투스. 아빠가 완성을 못 보고 세상을 떠나자, 서기 팔십 년에 콜로세움을 열었습니다. 개장 기념 경기만 무려 백 일 동안 했다고 해요.", "둘째 아들, 도미티아누스. 형 다음 황제로, 콜로세움 바닥 아래에 지하 시설을 만들어 무대 장치를 완성했습니다.", "네로, 아빠, 첫째, 둘째. 이 네 명만 알면 오늘 이야기는 다 따라오실 수 있어요."], "pos": null, "src": "audio/c/1-3.mp3", "dur": 65.5}, {"id": "1-4", "ch": "1. 미리 듣기", "title": "소요 시간과 동선", "text": ["이 투어는 전부 들으면 삼십 분 남짓이고, 걸으면서 둘러보는 시간까지 합치면 한 시간에서 한 시간 반쯤 걸립니다.", "동선은 이렇습니다. 먼저 입장 전에 콜로세움 바깥을 보면서 외벽 이야기를 듣고요, 입장한 뒤에는 일 층 복도를 지나 경기장 안을 처음 마주합니다. 그다음 계단으로 이 층에 올라가 경기장 전체를 내려다보고, 출구로 나와 바로 옆 콘스탄티누스 개선문에서 마무리합니다.", "이 투어는 가장 많이 사는 일반 티켓, 그러니까 일 층과 이 층을 보는 티켓 기준입니다. 경기장 바닥이나 지하까지 들어가는 티켓을 사셨다면, 해당 트랙에서 \"직접 내려가신 분들은\" 하고 따로 말씀드릴게요.", "한 번에 다 들을 필요는 없습니다. 미리 듣기 챕터는 숙소나 이동하는 길에 들어 두시면 현장에서 훨씬 여유로우실 거예요."], "pos": null, "src": "audio/c/1-4.mp3", "dur": 49.8}, {"id": "1-5", "ch": "1. 미리 듣기", "title": "티켓 사는 법", "text": ["콜로세움은 공식 사이트에서 사는 게 가장 쌉니다. 주소는 티케팅 점 콜로세오 점 아이티 입니다. 첨부한 화면 녹화 영상을 보면서 따라오세요.", "가장 많이 사는 티켓은 '콜로세움, 포로 로마노, 팔라티노' 이십사 시간 티켓입니다. 콜로세움 일 층과 이 층, 그리고 바로 옆 고대 로마 유적인 포로 로마노와 팔라티노 언덕을 이십사 시간 안에 한 번씩 들어갈 수 있어요. 가격은 십팔 유로입니다.", "꼭 알아야 할 함정이 세 가지 있습니다.", "첫째, 티켓은 방문일 삼십 일 전부터 열립니다. 성수기엔 금방 매진되니 열리자마자 사세요.", "둘째, 콜로세움은 입장 시간을 골라야 합니다. 그 시간에 맞춰 가야 해요.", "셋째, 티켓에 이름이 들어갑니다. 입구에서 신분증과 함께 확인하니 여권 영문 이름과 똑같이 적어 주세요. 이름은 나중에 고치기가 아주 까다롭습니다.", "참고로 매달 첫째 일요일은 무료입장인데요. 무료라서… 사람도 무료로 엄청 많습니다. 각오하고 가세요."], "pos": null, "src": "audio/c/1-5.mp3", "dur": 63.7}, {"id": "1-6", "ch": "1. 미리 듣기", "title": "방문 꿀팁", "text": ["출발 전에 딱 다섯 가지만 챙겨 볼게요.", "하나, 시간. 첫 타임인 아침 여덟 시 반이나 오후 늦게가 덜 붐빕니다. 운영 시간은 계절마다 바뀌니 공식 사이트에서 꼭 확인하세요.", "둘, 짐. 큰 배낭이나 캐리어는 들고 들어갈 수 없고, 안에 짐 보관소도 없습니다. 작은 가방만 들고 가세요. 공항 가는 날 캐리어 끌고 오시면… 콜로세움 앞에서 캐리어랑 같이 사진만 찍고 가셔야 합니다.", "셋, 물과 햇빛. 그늘이 거의 없어요. 물병은 들고 들어갈 수 있고, 주변에 물을 채울 수 있는 수도도 있습니다. 모자와 선크림 꼭 챙기세요.", "넷, 소매치기. 콜로세움 앞은 로마에서 손꼽히게 붐비는 곳입니다. 가방은 앞으로 메고, 휴대폰은 주머니 깊숙이. 그리고 갑자기 다가와서 팔찌를 채워 주거나 사진을 찍어 주겠다는 친절한 분들은… 대부분 공짜가 아닙니다.", "다섯, 입장 시간 삼십 분 전에는 도착하세요. 모두 보안 검색을 받아야 해서 줄이 생깁니다."], "pos": null, "src": "audio/c/1-6.mp3", "dur": 63.7}, {"id": "1-7", "ch": "1. 미리 듣기", "title": "가는 법", "text": ["콜로세움은 지하철로 가는 게 가장 편합니다. 지하철 비 선 '콜로세오'역에서 내리면, 역을 나서자마자 콜로세움이 눈앞에 딱 나타납니다. 이 첫 장면이 정말 압도적이니 꼭 지하철 타고 가 보세요.", "이천 이십 오년 십이월에는 씨 선 '콜로세오-포리 임페리알리'역도 새로 생겼습니다. 공사하다 나온 유물 수백 점을 역 안에 전시해 놓은 '박물관 역'이라, 시간이 되면 살짝 구경하셔도 좋아요.", "세 명 이상이라면 택시도 괜찮습니다. 다만 콜로세움 주변은 차가 못 들어가는 길이 많아서 조금 떨어진 곳에 내려 주기도 해요."], "pos": null, "src": "audio/c/1-7.mp3", "dur": 36.1}, {"id": "2-1", "ch": "2. 콜로세움 바깥 (줄 서면서 들어도 좋아요)", "title": "지금 이 자리, 원래는 호수였다", "text": ["콜로세움에 잘 도착하셨나요? 와… 어때요? 실제로 보니 생각보다 훨씬 크죠?", "높이는 무려 사십 팔 미터. 아파트로 치면 십육 층쯤 됩니다. 둘레는 원래 오백 미터가 넘었어요. 한 바퀴 걸으면 성인 걸음으로 칠팔 분 정도 걸립니다.", "그런데 여러분, 지금 서 계신 이 땅이 이천 년 전에는 물속이었다는 거 아세요? 아까 미리 듣기에서 말씀드렸죠? 폭군 네로가 자기 궁전 정원에 판 인공 호수가 바로 여기 있었습니다.", "네로가 죽고 황제가 된 베스파시아누스는 이 호수를 메워 버립니다. 그리고 그 위에 시민 모두가 공짜로 들어오는 경기장을 지었죠. 메시지가 아주 분명합니다. \"네로가 혼자 쓰던 땅, 이제 여러분께 돌려드립니다!\"", "현대로 치면 전임 회장님의 개인 골프장을 새 회장님이 갈아엎고 전 직원 체육관을 지어 준 셈이죠. 직원들 반응이요? 당연히 \"새 회장님 최고!\" 아니었을까요?", "자, 이제 콜로세움을 따라 천천히 걸으면서 바깥 이야기를 들어 볼게요."], "pos": [41.8906, 12.4912], "src": "audio/c/2-1.mp3", "dur": 64.2}, {"id": "2-2", "ch": "2. 콜로세움 바깥 (줄 서면서 들어도 좋아요)", "title": "콜로세움이라는 이름의 진짜 주인", "text": ["콜로세움. 이름이 참 웅장하죠? 그런데 이 이름, 사실 이 건물에서 나온 이름이 아닙니다.", "원래 이름은 아까 말씀드린 '플라비우스 원형경기장'이에요. 그럼 콜로세움은 어디서 왔을까요?", "바로 옆에 서 있던 거대한 동상 때문입니다. 네로는 자기 궁전 입구에 삼십 미터가 넘는 청동 거상을 세웠어요. 라틴어로 거상을 '콜로수스'라고 하는데요, 이 거대한 동상 옆에 있는 경기장이라고 해서 사람들이 콜로세움이라고 부르게 된 겁니다.", "나중에 하드리아누스 황제가 이 동상을 경기장 바로 옆으로 옮겼는데, 코끼리 스물네 마리를 동원했다는 기록이 있어요. 동상 하나 옮기는데 코끼리 스물네 마리. 이삿짐센터 견적이 어마어마했겠죠?", "결국 동상은 사라지고 이름만 남았습니다. 동상이 서 있던 받침대 자리는 지금도 콜로세움과 언덕 사이 바닥에 표시되어 있어요.", "재밌죠? 네로를 지우려고 지은 건물인데, 이천 년째 네로 동상 이름으로 불리고 있으니까요. 네로가 하늘에서 이걸 보면 아마 이러지 않을까요? \"결국 내 이름이 이겼군.\""], "pos": [41.89095, 12.4911], "src": "audio/c/2-2.mp3", "dur": 68.4}, {"id": "2-3", "ch": "2. 콜로세움 바깥 (줄 서면서 들어도 좋아요)", "title": "외벽 하나로 배우는 유럽 건축 기초", "text": ["콜로세움 외벽을 올려다보세요. 아치가 층층이 쌓여 있죠? 일 층, 이 층, 삼 층, 그리고 맨 위는 창문이 뚫린 벽입니다.", "여기서 오늘 유럽 여행 내내 써먹을 수 있는 걸 하나 알려 드릴게요. 아치 사이사이에 붙어 있는 기둥 장식을 보세요. 층마다 기둥 머리 모양이 다릅니다.", "일 층은 가장 단순하고 투박한 기둥. 이 층은 머리에 돌돌 말린 소용돌이가 있는 기둥. 삼 층은 나뭇잎이 풍성하게 달린 화려한 기둥이에요. 순서대로 도리스식, 이오니아식, 코린트식이라고 부릅니다.", "아래는 튼튼하고 단순하게, 위로 갈수록 가볍고 화려하게. 무거운 건 아래, 예쁜 건 위. 엄마가 냉장고 정리하는 원리랑 똑같죠?", "이 세 가지 기둥은 그리스 로마 건축의 기본이라, 유럽 성당이나 궁전에서도 계속 보게 될 거예요. 이제 어디서든 \"어? 이건 소용돌이니까 이오니아식!\" 하실 수 있습니다."], "pos": [41.89125, 12.4924], "src": "audio/c/2-3.mp3", "dur": 56.8}, {"id": "2-4", "ch": "2. 콜로세움 바깥 (줄 서면서 들어도 좋아요)", "title": "벽에 숭숭 뚫린 구멍의 정체", "text": ["외벽을 가까이 보면 돌마다 구멍이 숭숭 나 있죠? 마치 거대한 벌레가 파먹은 것 같아요. 이건 대체 뭘까요?", "총알 자국? 아닙니다. 원래 콜로세움의 큰 돌들은 시멘트 없이 쌓아 올렸어요. 대신 돌과 돌 사이를 쇠로 만든 고리로 꽉 물려 놨죠. 그 쇠가 무려 삼백 톤쯤 들어갔다고 합니다.", "그런데 로마가 무너지고 중세가 되자, 쇠가 귀해졌어요. 사람들은 돌 사이에 박힌 쇠를 빼 가려고 벽을 파냈습니다. 그 흔적이 바로 이 구멍들이에요.", "그러니까 이 구멍은 시간이 만든 상처가 아니라, 사람 손이 만든 상처인 셈이죠. 기억해 두세요. 콜로세움을 망가뜨린 건 전쟁보다 사람들의 '재활용 정신'이었습니다."], "pos": [41.891, 12.4933], "src": "audio/c/2-4.mp3", "dur": 45.9}, {"id": "2-5", "ch": "2. 콜로세움 바깥 (줄 서면서 들어도 좋아요)", "title": "콜로세움은 왜 반쪽만 남았을까", "text": ["콜로세움을 한 바퀴 보면 이상한 게 있습니다. 한쪽은 사 층 높이 외벽이 그대로 서 있는데, 반대쪽은 바깥 벽이 뚝 잘려 나가고 안쪽 벽만 남아 있죠.", "범인은 둘입니다. 첫 번째는 천 삼백 사십 구년에 일어난 큰 지진이에요. 땅이 무른 남쪽 외벽이 와르르 무너졌습니다.", "두 번째 범인은… 아까 그분들, 재활용 정신이 투철한 로마 사람들입니다. 무너진 돌은 그야말로 '공짜 건축 자재'였거든요. 중세와 르네상스 시대에 콜로세움은 거대한 채석장이 되었고, 여기서 가져간 돌로 성당과 궁전을 지었습니다. 바티칸의 성 베드로 대성당을 지을 때도 이 돌이 쓰였어요.", "그러니까 여러분이 바티칸에 가시면, 콜로세움을 한 번 더 보시게 되는 셈이죠. 원 플러스 원 관광입니다. 헤헤."], "pos": [41.8895, 12.4921], "src": "audio/c/2-5.mp3", "dur": 51.1}, {"id": "2-6", "ch": "2. 콜로세움 바깥 (줄 서면서 들어도 좋아요)", "title": "2천 년 전에도 지정석이 있었다", "text": ["일 층 아치 위쪽을 잘 보세요. 로마 숫자가 새겨진 아치가 있습니다. 이십삼, 이십사 같은 로마 숫자요. 찾으셨나요?", "이건 출입구 번호입니다. 콜로세움 일 층에는 아치가 팔십 개 있었는데, 그중 칠십 육 개에 번호를 붙여 일반 관객이 드나들었어요. 나머지 넷은 황제와 귀빈, 그리고 경기 출연자용이었고요.", "관객들은 번호가 적힌 입장표를 받았다고 해요. 표에 적힌 번호의 문으로 들어가, 정해진 계단을 올라, 자기 구역에 앉는 거죠. 지금 잠실야구장에서 \"삼루 쪽 몇 번 게이트\" 찾아 들어가는 거랑 똑같습니다.", "이렇게 입구를 나눈 덕분에 오만 명 가까운 사람이 큰 혼란 없이 드나들 수 있었어요. 이천 년 전 로마 사람들이 이미 '관중 동선'을 설계했던 겁니다.", "이제 입장할 시간에 맞춰 입구 쪽으로 가 주세요."], "pos": [41.8907, 12.4917], "src": "audio/c/2-6.mp3", "dur": 50.8}, {"id": "2-7", "ch": "2. 콜로세움 바깥 (줄 서면서 들어도 좋아요)", "title": "줄 서는 동안, 검투사에 대한 오해 세 가지", "text": ["줄 서느라 지루하시죠? 그동안 검투사 이야기를 해 볼게요. 영화에서 본 것 중에 사실이 아닌 게 꽤 많거든요.", "오해 하나. 검투사는 매번 죽을 때까지 싸웠다? 아닙니다. 검투사는 몸값이 아주 비싼 '프로 선수'였어요. 훈련시키고 먹이는 데 돈이 많이 드니까, 주인 입장에선 쉽게 죽게 둘 수 없었죠. 물론 목숨을 잃는 경우도 있었지만, 영화처럼 매번 피바다는 아니었다는 게 많은 학자들의 생각입니다.", "오해 둘. 검투사는 모두 끌려온 노예였다? 노예와 포로가 많았던 건 맞아요. 그런데 돈과 인기를 노리고 스스로 계약하고 들어온 자유인도 있었습니다. 인기 검투사는 요즘으로 치면 아이돌급 스타였어요. 벽에 팬들이 낙서한 응원 문구도 남아 있습니다.", "오해 셋. 검투사는 고기만 먹는 근육맨이었다? 터키 에페소스에서 발견된 검투사 묘지의 뼈를 분석해 보니, 주로 보리와 콩을 먹었다고 해요. 그래서 검투사를 '보리 먹는 사람들'이라는 별명으로 부르기도 했죠. 지방을 두툼하게 찌워서 칼에 베여도 덜 치명적이게 만들었다는 설도 있습니다. 근육맨이 아니라… 살짝 통통한 보리밥 파이터였던 거죠.", "줄이 줄었나요? 보안 검색을 통과하고 안으로 들어가 볼까요?"], "pos": [41.8901, 12.49105], "src": "audio/c/2-7.mp3", "dur": 79.2}, {"id": "3-1", "ch": "3. 1층 경기장", "title": "2천 년 된 콘크리트 복도", "text": ["안으로 잘 들어오셨나요? 지금 계신 곳은 경기장을 빙 둘러싼 일 층 복도입니다. 천장을 한 번 올려다보세요. 둥근 아치 천장이 끝없이 이어지죠?", "이게 로마 건축의 두 가지 무기, 아치와 콘크리트입니다. 아치는 위에서 누르는 무게를 양옆으로 나눠서 흘려보내요. 덕분에 큰 돌 기둥이 없어도 넓은 공간을 만들 수 있죠. 그리고 로마 사람들은 화산재를 섞은 콘크리트를 썼는데, 이게 이천 년을 버틸 만큼 튼튼했습니다. 현대로 치면 당시의 첨단 반도체 같은 기술이었던 셈이죠.", "이 거대한 경기장을 짓는 데 걸린 시간은 고작 십 년 남짓이에요. 크레인도, 트럭도 없던 시절에요. 어떻게 가능했을까요? 바로 이 아치를 똑같은 모양으로 수십 개씩 찍어 내듯 반복해서 쌓았기 때문입니다. 이천 년 전의 '모듈러 공법'이었던 셈이죠.", "복도를 따라 걷다 보면 경기장 안쪽이 확 보이는 곳이 나옵니다."], "pos": [41.89015, 12.49145], "src": "audio/c/3-1.mp3", "dur": 58.7}, {"id": "3-2", "ch": "3. 1층 경기장", "title": "경기장을 처음 마주하는 순간", "text": ["자, 이제 경기장 안을 보세요.", "…어때요? 바깥에서 볼 때랑은 완전히 다르죠?", "가운데 타원형 공간이 경기가 열리던 곳, '아레나'입니다. 지금은 바닥 아래 미로 같은 벽들이 훤히 드러나 있고, 한쪽 끝에만 나무 바닥이 깔려 있어요. 원래는 이 전체가 나무 바닥으로 덮여 있었습니다.", "아레나 크기는 길이 팔십 삼 미터, 폭 사십 팔 미터 정도. 농구 코트 일곱 개쯤 들어가는 넓이입니다. 생각보다 작다고요? 맞아요. 그래서 맨 꼭대기 자리에서도 선수 얼굴 표정까지는 몰라도, 누가 이기는지는 다 보였습니다.", "이 아레나를 빙 둘러 계단식 관중석이 있었고, 오만 명 가까운 사람들이 여기 앉았어요. 서울월드컵경기장 좌석이 육만 칠천 석쯤이니까, 그 사분의 삼 정도 되는 사람이 이천 년 전에 한자리에 모였던 겁니다.", "입장료는요? 공짜였습니다. 황제나 부자들이 돈을 대서 시민에게 쇼를 '선물'했어요. 로마의 한 시인은 이걸 비꼬아서 \"시민들은 이제 빵과 서커스만 바란다\"고 했죠. 먹을 것과 볼거리만 주면 정치엔 관심을 안 둔다는 뜻이에요.", "미리 듣기에서 말씀드린 오늘의 테마, 기억나시죠? 콜로세움은 황제가 시민의 마음을 사려고 만든 거대한 선물상자였습니다. 지금 여러분 눈앞에 있는 게 바로 그 선물상자예요."], "pos": [41.8902, 12.4917], "src": "audio/c/3-2.mp3", "dur": 81.6}, {"id": "3-3", "ch": "3. 1층 경기장", "title": "아레나는 원래 '모래'라는 뜻", "text": ["아레나. 요즘도 공연장이나 경기장 이름에 많이 붙죠? 이 말은 원래 라틴어로 '모래'라는 뜻입니다.", "경기장 나무 바닥 위에는 모래를 두툼하게 깔았어요. 왜 하필 모래였을까요?", "피를 빨아들이기 위해서입니다. 경기가 끝나면 피가 밴 모래를 긁어내고 새 모래를 뿌렸어요. 그러면 다음 경기는 다시 깨끗한 무대에서 시작하는 거죠.", "그러니까 우리가 콘서트 보러 '아레나'에 간다는 말은, 직역하면 '모래밭'에 간다는 뜻인 셈입니다. 다음에 공연장 가시면 바닥을 한 번 내려다보세요. 다행히 지금은 모래가 없습니다."], "pos": [41.89035, 12.492], "src": "audio/c/3-3.mp3", "dur": 36.3}, {"id": "3-4", "ch": "3. 1층 경기장", "title": "바닥 아래에 숨은 거대한 무대 장치", "text": ["아레나 아래로 미로처럼 얽힌 벽들이 보이시죠? 여기는 '히포게움', 그러니까 '땅 아래'라는 뜻의 지하 공간입니다. 아까 말씀드린 둘째 아들, 도미티아누스 황제가 만들었어요.", "여기는 이 층짜리 지하 세계였습니다. 맹수를 가둬 둔 우리, 검투사가 대기하던 방, 무대 소품 창고가 빼곡했죠.", "그리고 하이라이트. 지하에는 사람이 줄을 당겨 올리는 엘리베이터 같은 장치가 수십 개 있었어요. 경기 도중 바닥의 문이 갑자기 열리고, 사자나 곰이 '짠' 하고 아레나에 튀어나오는 거죠. 관객 입장에선 땅에서 맹수가 솟아오르는 겁니다. 이천 년 전의 포디 특수 효과였던 셈이죠.", "정말 이게 됐을까 궁금했던 사람들이 있었어요. 이천 십 오년, 한 다큐멘터리 팀이 고대 기록대로 나무 승강기를 실제 크기로 다시 만들어, 이 지하에서 늑대를 아레나 위로 올려 보내는 실험을 했습니다. 결과는요? 성공. 이천 년 전 방식 그대로, 늑대가 땅에서 솟아올랐습니다.", "지하까지 들어가는 티켓을 사신 분들은 이따 직접 그 통로를 걸어 보시게 될 거예요. 어둡고 좁은 그 길을 걸으며, 여기서 차례를 기다리던 사람과 동물의 마음을 한 번 상상해 보세요."], "pos": [41.8901, 12.49205], "src": "audio/c/3-4.mp3", "dur": 73.7}, {"id": "3-5", "ch": "3. 1층 경기장", "title": "콜로세움의 하루 일정표", "text": ["그럼 여기서는 하루 종일 무슨 쇼를 했을까요? 콜로세움의 하루 일정표를 한번 짜 볼게요.", "오전에는 동물 사냥 쇼. 사자, 표범, 곰, 심지어 코끼리까지, 제국 곳곳에서 데려온 동물들이 등장했어요. 당시 로마 사람들에겐 처음 보는 동물 자체가 엄청난 구경거리였죠. 당시에는 넷플릭스 동물 다큐가 없었으니까요.", "점심 시간에는 사형 집행. 죄수를 공개적으로 처형했습니다. 밥 먹는 시간에 이런 걸 보여 줬다니, 로마 사람들 입맛은 참 특이했죠.", "그리고 오후, 메인 이벤트. 검투사 경기입니다. 하루의 하이라이트라 관중이 가장 많이 몰렸죠.", "개장 기념으로는 이런 날을 무려 백 일 동안 이어 갔다고 합니다. 그때 죽은 동물만 구천 마리가 넘었다는 기록도 있어요. 화려한 선물상자 안에는, 이렇게 수많은 생명이 담겨 있었던 겁니다."], "pos": [41.8904, 12.4923], "src": "audio/c/3-5.mp3", "dur": 53.6}, {"id": "3-6", "ch": "3. 1층 경기장", "title": "엄지 척 엄지 아래", "text": ["검투사 경기가 끝나고 한 사람이 쓰러지면, 관중이 엄지를 아래로 내려 \"죽여라!\"를 외치는 장면. 영화에서 많이 보셨죠?", "그런데 이거, 확실한 사실이 아닙니다. 고대 기록에는 '엄지를 돌려서'라는 표현만 남아 있어요. 엄지를 위로 했는지, 아래로 했는지, 옆으로 했는지는 아무도 모릅니다.", "그럼 '엄지 아래는 죽여라'는 어디서 나왔을까요? 천 팔백 칠십 이년에 프랑스 화가 제롬이 그린 그림 한 장 때문이라는 설이 유력해요. 관중이 엄지를 아래로 내리는 장면을 그렸는데, 이 그림이 크게 히트하면서 영화들이 그대로 따라 한 거죠.", "이천 년 동안 아무도 몰랐던 손동작을, 그림 한 장이 정해 버린 셈이죠. 아무튼 이 트랙이 마음에 드셨다면… 엄지는 위로! 헤헤."], "pos": [41.89005, 12.4924], "src": "audio/c/3-6.mp3", "dur": 49.2}, {"id": "3-7", "ch": "3. 1층 경기장", "title": "경기장 위의 십자가", "text": ["경기장 가장자리 한쪽에 커다란 십자가가 서 있는 게 보이시나요?", "왜 경기장에 십자가가 있을까요? 오랫동안 사람들은 이곳에서 수많은 초기 그리스도교 신자들이 사자에게 던져져 순교했다고 믿었습니다. 그래서 천 칠백 사십 구년, 교황은 콜로세움을 순교자의 성지로 선포했어요.", "그리고 이 선포 덕분에 콜로세움은 살아남았습니다. 성지에서 돌을 빼 가는 건 금지됐거든요. 채석장 신세에서 벗어난 거죠.", "그런데… 반전이 있습니다. 실제로 이곳에서 그리스도교 신자들이 순교했다는 확실한 증거는 거의 없어요. 많은 학자들은 순교가 주로 다른 경기장이나 처형장에서 일어났다고 봅니다.", "진짜였든 아니든, 그 믿음이 이 건물을 지킨 셈이죠. 지금도 매년 부활절 직전 금요일 밤이면 교황이 이곳에서 예수의 고난을 기리는 '십자가의 길' 기도를 이끕니다."], "pos": [41.8905, 12.4918], "src": "audio/c/3-7.mp3", "dur": 55.4}, {"id": "3-8", "ch": "3. 1층 경기장", "title": "콜로세움에서 해전을", "text": ["마지막으로 일 층에서 들려드릴 이야기는, 조금 믿기 힘든 이야기입니다.", "고대 기록에 따르면, 콜로세움 초기에 이 경기장에 물을 채워 배를 띄우고 '모의 해전'을 벌였다고 해요. 경기장이 수영장이 된 거죠.", "정말 가능했을까요? 학자들 사이에서도 의견이 갈립니다. 물을 채우고 뺀 흔적이 뚜렷하게 남아 있지 않거든요. 다만 확실한 건, 도미티아누스가 지하 시설을 만든 다음부터는 물을 채우는 게 불가능해졌다는 겁니다. 바닥 아래가 미로로 꽉 찼으니까요.", "어쩌면 이 땅이 원래 네로의 호수였다는 걸 기억한 누군가가, 마지막으로 한 번 더 물을 채워 본 건 아닐까요? 상상은 자유입니다.", "자, 이제 이 층으로 올라가 볼게요."], "pos": [41.8902, 12.4926], "src": "audio/c/3-8.mp3", "dur": 45.3}, {"id": "4-1", "ch": "4. 2층", "title": "계단을 오르며 — 보미토리움의 오해", "text": ["계단을 오르고 계신가요? 이천 년 전 관객들도 이렇게 계단을 올라 자기 자리로 갔습니다.", "관중석으로 이어지는 이런 출입 통로를 라틴어로 '보미토리움'이라고 불렀어요. 그런데 이 단어, 어디서 많이 들어 본 것 같지 않나요? 영어로 '토하다'가 보밋이잖아요.", "그래서 \"로마 사람들은 잔치에서 배 터지게 먹고, 보미토리움이라는 방에서 토한 다음 또 먹었다\"는 이야기가 퍼졌는데요. 이건 완전히 오해입니다.", "보미토리움은 '쏟아 내는 곳'이라는 뜻이에요. 경기가 끝나면 이 통로들이 관중을 바깥으로 와르르 쏟아 냈거든요. 토하는 방이 아니라, 사람을 토해 내는 통로였던 거죠.", "계단을 다 오르면 경기장이 내려다보이는 곳이 나옵니다."], "pos": [41.8906, 12.4915], "src": "audio/c/4-1.mp3", "dur": 45.5}, {"id": "4-2", "ch": "4. 2층", "title": "신분 순서대로 앉은 5만 명", "text": ["이 층에서 내려다보니 어떠세요? 이제야 콜로세움이 한눈에 들어오죠?", "여기 앉은 오만 명은 아무 데나 앉지 않았어요. 신분에 따라 자리가 딱딱 정해져 있었습니다.", "맨 아래, 아레나와 가장 가까운 자리는 원로원 의원들. 대리석 좌석에 자기 이름까지 새겨져 있었어요. 그리고 경기장 긴 쪽 한가운데, 가장 잘 보이는 자리에는 황제의 특별석이 있었죠.", "그 위로 기사 계급, 그 위로 일반 시민. 그리고 맨 꼭대기, 지금은 거의 사라진 나무 관중석에는 가난한 사람들, 노예, 그리고 여성들이 앉았습니다. 여러분이 서 계신 이 이 층 높이쯤은 평범한 시민들 자리였어요. 오늘 우리는 로마 시민 자격으로 관람 중인 셈이죠.", "아래에서 위로 올라갈수록 신분은 낮아지고, 경기장은 멀어지죠. 콜로세움은 경기장인 동시에 로마 사회를 그대로 옮겨 놓은 거대한 단면도였습니다.", "그리고 생각해 보세요. 황제석은 경기장에서 가장 잘 보이는 자리이면서, 오만 명 모두에게 가장 잘 보이는 자리이기도 했어요. 황제는 여기 앉아 쇼를 보는 동시에, 시민들에게 자신을 보여 준 겁니다. 선물을 주는 사람이 누구인지, 모두가 똑똑히 보도록요."], "pos": [41.89075, 12.492], "src": "audio/c/4-2.mp3", "dur": 74.8}, {"id": "4-3", "ch": "4. 2층", "title": "하늘을 덮은 거대한 천막", "text": ["이번엔 고개를 들어 콜로세움 꼭대기 테두리를 보세요. 맨 위 벽에 작은 돌 받침들이 일정한 간격으로 튀어나와 있죠?", "여기에 기둥 이백 사십 개를 꽂고, 거대한 천막을 펼쳐 관중석에 그늘을 만들었습니다. 이 천막을 '벨라리움'이라고 불러요.", "맑은 날 로마 햇빛, 만만치 않죠? 이 땡볕 아래 하루 종일 쇼를 보려면 그늘이 꼭 필요했겠죠. 천막은 경기장의 삼분의 이 정도를 덮을 수 있었다고 해요.", "그런데 이 엄청난 천막, 누가 펼쳤을까요? 바로 해군 수병들입니다. 나폴리 근처 해군 기지에서 수병들을 데려와 이 일을 맡겼어요. 돛을 다뤄 본 사람들이니까요. 바다에서 돛 올리던 사람들이, 콜로세움에서는 하늘에 돛을 올린 셈이죠.", "공짜 입장에, 그늘까지. 황제의 선물은 참 세심했습니다."], "pos": [41.89078, 12.49245], "src": "audio/c/4-3.mp3", "dur": 51.7}, {"id": "4-4", "ch": "4. 2층", "title": "2층 전시 공간 둘러보기", "text": ["이 층 복도 한쪽에는 작은 전시 공간이 있습니다.", "여기서는 콜로세움에서 발견된 유물들, 관중석 좌석 조각, 그리고 콜로세움이 시대마다 어떻게 쓰였는지 보여 주는 전시를 볼 수 있어요.", "천천히 둘러보시고, 경기장 바깥쪽 창문으로 가 볼까요?"], "pos": [41.89065, 12.4928], "src": "audio/c/4-4.mp3", "dur": 17.6}, {"id": "4-5", "ch": "4. 2층", "title": "창밖으로 보이는 고대 로마", "text": ["이 층 바깥쪽 아치 창문으로 밖을 내다보세요.", "한쪽으로는 커다란 개선문이 보입니다. 이따 출구로 나가서 바로 보게 될 콘스탄티누스 개선문이에요.", "그 너머 언덕은 팔라티노 언덕. 로마가 처음 시작된 곳이자, 황제들의 궁전이 있던 곳입니다. 영어 단어 팰리스, 궁전이 바로 이 '팔라티노'에서 나왔어요.", "그리고 언덕 옆으로 펼쳐진 유적지가 포로 로마노. 고대 로마의 광장이자 정치의 중심지였습니다. 지금 들고 계신 티켓으로 오늘 안에 들어갈 수 있는 곳이에요.", "언덕 위 궁전에 사는 황제, 광장에서 정치하는 원로원, 그리고 경기장에서 환호하는 시민. 고대 로마의 세 가지 얼굴이 이 창문 하나에 다 들어오는 셈이죠.", "다 보셨으면 출구 방향으로 내려가 주세요."], "pos": [41.89045, 12.493], "src": "audio/c/4-5.mp3", "dur": 47.2}, {"id": "5-1", "ch": "5. 나가며", "title": "콜로세움의 2천 년 인생", "text": ["출구로 잘 나오셨나요? 나가기 전에, 뒤를 돌아 콜로세움을 한 번 더 보세요. 이제 들어올 때와는 좀 달라 보이지 않나요?", "이 건물의 인생을 한번 정리해 볼게요.", "처음엔 황제의 선물상자. 오 세기 무렵 검투사 경기가 사라지고, 동물 사냥 쇼도 육 세기 초를 마지막으로 끝이 납니다.", "그다음엔 집. 중세 사람들은 이 안에 들어와 살았어요. 아치 안에 집을 짓고, 공방을 차리고, 한때는 귀족 가문이 요새로 쓰기도 했죠.", "그다음엔 채석장. 지진으로 무너진 돌을 다 가져다 썼고요.", "그다음엔 성지. 순교자의 성지가 되면서 겨우 살아남았습니다.", "그리고 지금은? 매년 수백만 명이 찾는 로마의 얼굴이 되었죠.", "오래된 말 중에 이런 말이 있어요. \"콜로세움이 서 있는 한 로마도 서 있을 것이고, 콜로세움이 무너지면 로마도 무너질 것이다.\" 반쪽이 무너지고도 콜로세움은 여전히 서 있고, 로마도 여전히 서 있습니다.", "네로의 호수에서 시작해, 시민의 놀이터가 되었다가, 이제는 전 세계 사람들의 놀이터가 된 이 건물. 황제가 이천 년 전에 포장한 선물상자를 지금은 우리가 십팔 유로 내고 열어 보고 있는 셈이죠. 이번엔 공짜가 아니라는 게 좀 아쉽지만요."], "pos": [41.88975, 12.4914], "src": "audio/c/5-1.mp3", "dur": 77.0}, {"id": "5-2", "ch": "5. 나가며", "title": "남의 것을 떼어 붙인 개선문", "text": ["콜로세움 바로 옆, 거대한 문이 하나 서 있죠? 콘스탄티누스 개선문입니다. 그쪽으로 가 보세요.", "개선문은 전쟁에서 이긴 황제를 기념하는 문이에요. 서기 삼백 십 이년, 콘스탄티누스 황제가 로마 근처 전투에서 경쟁자를 물리쳤고, 그 승리를 기념해 삼백 십 오년에 이 문을 세웠습니다. 콘스탄티누스는 나중에 그리스도교를 공인한 황제로도 유명하죠.", "그런데 이 개선문에는 재밌는 비밀이 있어요. 위쪽 조각들을 잘 보세요. 스타일이 제각각이죠? 사실 상당 부분이 더 옛날 황제들의 기념물에서 떼어 와 붙인 겁니다. 트라야누스, 하드리아누스, 마르쿠스 아우렐리우스, 백 년도 더 전에 존경받던 황제들의 조각이에요.", "왜 그랬을까요? 시간과 돈을 아끼려고 그랬다는 설도 있고, \"나는 저 위대한 황제들의 후계자다\"라는 메시지를 주려고 일부러 그랬다는 설도 있습니다. 아마 둘 다 아니었을까요?", "생각해 보면 콜로세움의 돌이 성 베드로 대성당에 들어갔듯, 로마는 원래 이렇게 옛것을 떼어다 새것을 만드는 도시였어요. 로마는 하루아침에 이루어지지 않았다고 하죠? 대신 로마는, 다른 로마를 재활용해서 이루어졌습니다."], "pos": [41.88981, 12.49067], "src": "audio/c/5-2.mp3", "dur": 74.8}, {"id": "5-3", "ch": "5. 나가며", "title": "포로 로마노·팔라티노 가는 법", "text": ["여러분의 티켓에는 포로 로마노와 팔라티노 언덕 입장도 들어 있습니다. 이십사 시간 안에 한 번 들어갈 수 있으니, 기운이 남아 있다면 오늘 바로 가 보세요.", "콘스탄티누스 개선문을 등지고 언덕 쪽으로 걸어가면 입구가 나옵니다.", "포로 로마노와 팔라티노는 그늘이 더 없고 언덕도 오르내려야 합니다. 물 한 번 채우고, 화장실도 미리 다녀오세요."], "pos": [41.8907, 12.4888], "src": "audio/c/5-3.mp3", "dur": 22.4}], "center":
